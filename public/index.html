    worldCfg = await loadWorldConfig();
    // Dungeons are compiled to zones and merged into the same lookup, so `changeZone`,
    // `entryPointFor` and the zone-name labels all work on them without knowing they are
    // interiors. Failing to load them must not take the outdoor world down with it.
    try {
      for (const d of await loadDungeons()){
        const z = dungeonZone(d);
        worldCfg.zones[z.id] = z;
        if (!worldCfg.zoneIds.includes(z.id)) worldCfg.zoneIds.push(z.id);
      }
    } catch(e){ console.warn("dungeons unavailable:", e && e.message); }
    // Register the dorm at boot too, so a player who quit inside it is not silently teleported
    // back to the hub on the next load — `S.worldState.zone` would name a zone nothing knew about.
    if (S.home && S.home.owned){
      try {
        const dz = DORM.dormZone(S, { entranceZone:"academy", schoolColor: SCHOOLS[S.school].color, gradeOf: gradeForRoll });
        worldCfg.zones[dz.id] = dz;
        if (!worldCfg.zoneIds.includes(dz.id)) worldCfg.zoneIds.push(dz.id);
      } catch(e){ console.warn("dorm unavailable:", e && e.message); }
    }
    // ?zone= wins, then wherever the player last logged out, then the hub.
    const wanted = new URLSearchParams(location.search).get("zone") || (S.worldState && S.worldState.zone);
    activeZone = (wanted && worldCfg.get(wanted)) || worldCfg.get(worldCfg.hub);
    if (wanted && !worldCfg.get(wanted)) console.warn("unknown zone \"" + wanted + "\", using the hub");
  } catch(e){
    console.warn("world config unavailable, using built-in academy:", e && e.message);
  }
  try {
    world = spawnWorld(canvas, activeZone, null);
  } catch(e){ console.warn("3D world unavailable:", e); return; }
  // Exposed for tools/browser-test.mjs, which drives the real input/collision paths that the
  // headless smoke test cannot reach (createWorld needs WebGL).
  window.__world = world;
  // ---------------- world input ----------------
  // Unified on Pointer Events so mouse, touch and pen all take the same path. Every gesture is
  // tracked by pointerId, which is what makes "drag to rotate" and "pinch to zoom" coexist:
  // the old code tracked a single drag and kept rotating the camera during a two-finger pinch.
  const isTouch = isTouchDevice;
  if (isTouch) document.body.classList.add("has-touch");

  // ---- joystick ----
  const joy = $("joy"), knob = $("joyKnob");
  let joyId = null, joyBase = null, joyRadius = 46;
  function joySet(dx, dy){
    world.setTouchMove(dx, dy);
    // the knob follows the finger, clamped to the ring, so the control reads as analogue
    knob.style.transform = `translate(calc(-50% + ${dx*joyRadius}px), calc(-50% + ${dy*joyRadius}px))`;
  }
  function joyStart(e){
    if (joyId !== null) return;
    joyId = e.pointerId;
    const r = joy.getBoundingClientRect();
    joyBase = { x:r.left+r.width/2, y:r.top+r.height/2 };
    joyRadius = r.width * 0.29;            // how far the knob may travel from centre
    joy.classList.add("active");
    try { joy.setPointerCapture(e.pointerId); } catch(_){}
    joyMove(e);
    e.preventDefault();
  }
  function joyMove(e){
    if (joyId !== e.pointerId || !joyBase) return;
    // normalise against the ring radius, then clamp to the unit circle (not a square) so
    // diagonal input isn't faster than cardinal input
    let dx = (e.clientX-joyBase.x)/(joyRadius*1.6);
    let dy = (e.clientY-joyBase.y)/(joyRadius*1.6);
    const len = Math.hypot(dx, dy);
    if (len > 1){ dx/=len; dy/=len; }
    if (len < 0.12){ dx = 0; dy = 0; }     // small dead zone stops drift on a resting thumb
    joySet(dx, dy);
    e.preventDefault();
  }
  function joyEnd(e){
    if (joyId !== null && e && e.pointerId !== joyId) return;
    joyId = null; joyBase = null;
    joy.classList.remove("active");
    joySet(0, 0);
  }
  joy.addEventListener("pointerdown", joyStart);
  joy.addEventListener("pointermove", joyMove);
  joy.addEventListener("pointerup", joyEnd);
  joy.addEventListener("pointercancel", joyEnd);
  joy.addEventListener("lostpointercapture", joyEnd);

  // ---- camera drag / pinch / tap-to-move ----
  const pointers = new Map();            // active pointers on the canvas, by id
  let dragId = null, dragMoved = false, lastX = 0, lastY = 0, startX = 0, startY = 0, pinchDist = 0, downAt = 0;
  const TAP_SLOP = 8, TAP_MS = 350;      // a tap is a short press that barely moves

  canvas.addEventListener("pointerdown", e=>{
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pointers.size === 1){
      dragId = e.pointerId; dragMoved = false; downAt = performance.now();
      lastX = startX = e.clientX; lastY = startY = e.clientY;
      try { canvas.setPointerCapture(e.pointerId); } catch(_){}
    } else if (pointers.size === 2){
      // a second finger turns the gesture into a pinch: stop rotating and never fire a tap
      dragId = null; dragMoved = true;
      pinchDist = spread();
    }
    e.preventDefault();
  });

  function spread(){
    const [a,b] = [...pointers.values()];
    return Math.hypot(a.x-b.x, a.y-b.y);
  }

  canvas.addEventListener("pointermove", e=>{
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pointers.size === 2){
      const d = spread();
      if (pinchDist) world.zoomCam(pinchDist - d);   // pinch in = zoom out
      pinchDist = d;
      return;
    }
    if (e.pointerId !== dragId) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    // once the press has travelled past the tap slop it becomes a rotate and stays one
    if (!dragMoved && Math.hypot(e.clientX-startX, e.clientY-startY) > TAP_SLOP) dragMoved = true;
    if (dragMoved && world) world.rotateCam(dx);
    lastX = e.clientX; lastY = e.clientY;
  });

  function pointerDone(e){
    const wasDrag = e.pointerId === dragId;
    const quick = performance.now() - downAt < TAP_MS;
    pointers.delete(e.pointerId);
    if (wasDrag && !dragMoved && quick && e.type === "pointerup" && world){
      world.tapAt(e.clientX, e.clientY);            // tap-to-move
    }
    if (wasDrag) dragId = null;
    if (pointers.size < 2) pinchDist = 0;
    // one finger lifted from a pinch: hand the drag to the finger still down, without
    // treating the transition as a tap
    if (pointers.size === 1 && dragId === null){
      const [id, pt] = [...pointers.entries()][0];
      dragId = id; dragMoved = true; lastX = startX = pt.x; lastY = startY = pt.y;
    }
  }
  canvas.addEventListener("pointerup", pointerDone);
  canvas.addEventListener("pointercancel", pointerDone);

  // desktop: wheel to zoom
  canvas.addEventListener("wheel", e=>{ if (world){ world.zoomCam(e.deltaY * 0.6); e.preventDefault(); } }, {passive:false});
  // on-screen zoom buttons (one-handed / no-wheel fallback)
  const holdZoom = (el, dir) => {
    let t = null;
    const go = e => { e.preventDefault(); world && world.zoomCam(dir*18); t = setInterval(()=>world && world.zoomCam(dir*8), 90); };
    const stop = () => { clearInterval(t); t = null; };
    el.addEventListener("pointerdown", go);
    el.addEventListener("pointerup", stop);
    el.addEventListener("pointercancel", stop);
    el.addEventListener("pointerleave", stop);
  };
  holdZoom($("zoomIn"), -1); holdZoom($("zoomOut"), 1);

  // keep the renderer matched to the element, including on orientation change / chrome collapse
  const resizeWorld = () => world && world.resize();
  window.addEventListener("orientationchange", ()=>setTimeout(resizeWorld, 250));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resizeWorld);

  if (isTouch) joy.style.display = "block";
  const hud = $("worldHud");
  if (!hud.textContent) hud.textContent = isTouch ? STR.world_hint_touch : STR.world_hint_desktop;
  hud.style.display = "block";
}
window.__EV.worldGo = ()=>{ if (world) world.trigger(); };
// Test hooks for tools/browser-test.mjs. They drive the REAL functions rather than reimplementing
// them, so the test cannot pass against a path the game does not actually use.
window.__testBattle = ()=> battle;
window.__testSave = ()=> S;
window.__testAiTurn = ()=>{ if (battle) G.aiTurn(battle); };
// Leave the duel screen cleanly without going through a real win/loss, for tests that only need
// to inspect the battle object mid-fight rather than play it out.
window.__testEndBattle = ()=>{ battle = null; screen = "world"; render(); };
window.__testGather = ()=>{ const m = MATERIALS.find(x=>x.id==="oak_log"); G.gather(S, m); save(); };
window.__testDuel = ()=>{ startPracticeDuel(); };
window.__testRender = ()=>{ render(); };
window.__testGold = ()=> S.gold;
// Grant exactly the materials a gather quest asks for — the alternative is mining eight logs in
// a browser test, which tests the gather loop rather than the quest turn-in.
window.__testGrant = (questId)=>{
  const q = ZQ.ZONE_QUESTS.find(x=>x.id===questId);
  if (!q || q.objective.kind !== "gather") return false;
  S.inventory[q.objective.id] = (S.inventory[q.objective.id]||0) + q.objective.n;
  save(); return true;
};
// Give the player a furnished dorm without playing an hour of economy first. It uses the real
// buy/place/display functions, so the test still exercises the code the game runs — only the
// gold and the boss kill are handed over.
window.__testDorm = ()=>{
  S.gold += 5000; S.inventory.oak_log = (S.inventory.oak_log||0) + 60;
  G.buyHome(S);
  for (const u of HOME_UPGRADES) for (let i=0;i<3;i++) G.upgradeHome(S, u.id);
  for (const id of ["bed","bookshelf","case","brazier"]) DORM.buyFurniture(S, id);
  DORM.place(S, "floor_a", "bed"); DORM.place(S, "wall_a", "bookshelf");
  DORM.place(S, "case_a", "case"); DORM.place(S, "floor_b", "brazier");
  // a slabbed card to display, and a dead boss to earn a trophy
  const slab = { uid:"testslab", id:S.cards[0].id, roll:99, graded:true, serial:9001 };
  S.cards.push(slab);
  DORM.displayIn(S, "case_a", slab.uid);
  S.worldState.dungeons.cinderhollow_caverns = S.worldState.dungeons.cinderhollow_caverns || { cleared:[], defeated:[] };
  S.worldState.dungeons.cinderhollow_caverns.bossDead = true;
  save();
  return { tier: DORM.tierFor(S).id, placed: Object.keys(S.home.furniture).length };
};
window.__testEnterDorm = ()=>{ enterDorm(); };
window.__testPreview = ()=> preview;
// Satisfy one class's assignment by writing the counter it reads, so the browser test can drive
// the real enrol -> submit -> technique-applied loop without playing an hour of economy first.
window.__testLessonReady = (id)=>{
  const l = LSN.byId(id); if (!l) return false;
  const a = l.assign;
  if (a.kind === "skill") S.skills[a.id] = a.level;
  else if (a.kind === "level") S.level = a.n;
  else if (a.kind === "collect") while (S.cards.length < a.n) S.cards.push({ uid:G.uid(), id:S.cards[0].id, roll:1, graded:false });
  else S.stats[{ scribe:"scribed", refine:"refined", grade:"graded", slabs:"slabs", win:"won", packs:"packs" }[a.kind]] = a.n;
  save(); return true;
};
window.__testMastery = ()=> LSN.masteryFor(S);
// Give the player one of each printing so the collection grid can be inspected. Uses mintCard so
// the instances are shaped exactly as the game makes them.
window.__testPrintings = ()=>{
  for (const v of VAR.VARIANTS) G.mintCard(S, CARDS[0].id, 55, { variant: v.id });
  save(); return VAR.tallyFor(S.cards);
};
// Forge and equip a full set at one metal tier, then re-derive the attachments. Uses the real
// engine functions so the test cannot pass against a path the game does not take.
window.__testEquipStats = ()=> G.equipStats(S);
window.__testGear = (metal)=>{
  for (const slot of SLOTS){
    const def = equipmentFor(metal, slot.id);
    const item = { uid: G.uid(), id: def.id, metal, slot: slot.id, tier: def.tier };
    S.equipment.push(item);
    G.equip(S, item.uid);
  }
  refreshGear(); save();
  return { attachments: EQ3.attachmentsFor(S).map(a=>({slot:a.slot,bone:a.bone,model:a.model,h:a.height})),
           bones: window.__testBones(), gear: window.__world && window.__world.gearDebug ? window.__world.gearDebug() : null };
};
window.__testBones = ()=>{
  const w = window.__world && window.__world.playerBones && window.__world.playerBones();
  return w || null;
};
window.__testAppearance = ()=> CC.appearanceFor(S);
window.__testDormRoom = ()=>{ const r = DORM.dormRoom(S); return [r.w, r.d]; };
window.__testDormUpgrade = ()=>{ S.gold += 5000; S.inventory.oak_log = (S.inventory.oak_log||0) + 60;
  for (const u of HOME_UPGRADES) G.upgradeHome(S, u.id); save(); return DORM.tierFor(S).id; };
window.__testBoard = ()=>{
  battle.you.pips = 9; battle.enemy.pips = 9;
  battle.you.hand[0] = "fire_dragon"; window.__ev("play|0");
  battle.you.hand[0] = "fire_cat"; window.__ev("play|0");
  battle.enemy.hand[0] = "ice_golem"; G.playCard(battle, battle.enemy, 0, null);
  syncBattle3d();
  return { you: battle.you.board.length, enemy: battle.enemy.board.length };
};
// Force a specific card into hand and cast it — used to photograph and test each VFX archetype
// without having to play a real duel until the right card is drawn.
window.__testCast = (cardId, targetIdx)=>{
  if (!battle) return false;
  battle.you.hand[0] = cardId; battle.you.pips = 9;
  castVfx(cardId, "you", targetIdx == null ? null : targetIdx);
  return true;
};
window.__testKill = ()=>{ if (battle && battle.dungeonFoe){ recordDungeonKill(battle.dungeonFoe); save(); } };
window.__EV.toggleMute = ()=>{
  AUDIO.unlock();
  AUDIO.setMuted(!AUDIO.isMuted());
  const b = $("muteBtn");
  b.textContent = AUDIO.isMuted() ? "🔇" : "🔊";
  if (!AUDIO.isMuted()) AUDIO.play("ui");
  toast(AUDIO.isMuted() ? STR.sound_off : STR.sound_on);
};

// ================= boot =================
async function boot(){
  $("muteBtn").textContent = AUDIO.isMuted() ? "🔇" : "🔊";
  await initWorld();
  if (world){ world.setPlayerAppearance(CC.appearanceFor(S)); world.setPlayerGear(EQ3.attachmentsFor(S)); }
  // Character creation replaces the bare school picker on a fresh save. It is skipped for any
  // save that already finished it, and `CC.isComplete` is DERIVED, so an older save that has a
  // school but no name is walked through the remaining steps rather than either re-doing the
  // school or being left half-created.
  if (!CC.isComplete(S)) showCharCreate();
  // online room from URL
  const roomParam = new URLSearchParams(location.search).get("room");
  if (roomParam){
    online = { playerId: sessionStorage.getItem("mp-player-id")||("p-"+Math.random().toString(36).slice(2,10)),
      room: roomParam, ws:null, state:null, deck: S.deck.slice() };
    sessionStorage.setItem("mp-player-id", online.playerId);
    if (S.deck.length===G.MAX_DECK){ screen="online"; connectOnline(); }
  }
  render();
  // gather cooldown tick
  setInterval(()=>{ if (gatherCooldown>0) gatherCooldown-=0.1; }, 100);
  // auction tick
  setInterval(()=>{ if (screen==="market") render(); }, 1000);
  setInterval(()=>{ G.save(S); }, 3000);
}
boot();
</script>
