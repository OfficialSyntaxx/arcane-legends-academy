<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1440">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./assets/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<title>Arcane Legends — Wizard TCG</title>
<style>
:root{
  --gold:#ffc94d; --gold2:#e8a33d; --violet:#2a1f4d; --panel:#1a1430; --panel2:#241c44;
  --ink:#f2ecff; --muted:#a99fc9; --line:rgba(255,201,77,.25);
  --danger:#ff6b6b; --ok:#6ee7a0; --info:#7aa8ff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:#0d0a1f;color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;
  overscroll-behavior:none;text-size-adjust:100%;-webkit-text-size-adjust:100%;}
/* safe-area insets, so nothing hides under a notch or the home indicator */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);}
#bg{position:fixed;inset:0;background:center/cover url(./assets/title_bg.jpg);filter:brightness(.45) saturate(1.1);z-index:0;}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:1200px;margin:0 auto;
  padding-left:var(--sal);padding-right:var(--sar);}
/* dvh tracks the collapsing mobile browser chrome; % does not */
@supports (height:100dvh){ #app{height:100dvh;} }

/* top bar */
#topbar{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat)) 14px 10px;
  background:linear-gradient(180deg,rgba(20,14,40,.95),rgba(20,14,40,.7));
  border-bottom:1px solid var(--line);z-index:5;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
#topbar::-webkit-scrollbar{display:none;}
#topbar .logo{font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--gold);
  text-shadow:0 0 12px rgba(255,201,77,.5);letter-spacing:1px;margin-right:auto;}
.stat{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:14px;white-space:nowrap;flex:0 0 auto;}
.stat b{color:var(--gold);font-weight:700;}
/* a stat pill that is also a control still needs a real tap target */
.statbtn{cursor:pointer;font-family:inherit;color:var(--ink);min-height:34px;min-width:44px;
  justify-content:center;font-size:17px;line-height:1;touch-action:manipulation;}

/* nav */
#nav{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:rgba(20,14,40,.9);border-bottom:1px solid var(--line);
  z-index:5;flex-shrink:0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#nav::-webkit-scrollbar{display:none;}
.navbtn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 12px;border-radius:10px;
  border:1px solid transparent;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;min-width:64px;min-height:48px;}
.navbtn .ic{font-size:20px;}
@media (hover:hover){ .navbtn:hover{background:var(--panel2);color:var(--ink);} }
.navbtn.on{background:var(--panel2);color:var(--gold);border-color:var(--line);}

/* screens */
/* The duel arena is a BAND, not a half-screen. It used to be flex:1 alongside #screen, so the
   two split the viewport and the player's hand was pushed below the fold behind it. Bounded
   height keeps the cards reachable, which matters more than a big 3D view. */
#battleWrap{position:relative;flex:0 0 clamp(190px, 30vh, 330px);overflow:hidden;background:#0d0820;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
#battle3d{position:absolute;inset:0;width:100%;height:100%;display:block;}
#screen{padding:14px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;padding-bottom:calc(40px + var(--sab));-webkit-overflow-scrolling:touch;}
.screen{display:none;animation:fade .25s ease;}
.screen.on{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;}}
h2{font-family:Georgia,serif;color:var(--gold);margin:2px 0 12px;font-size:22px;letter-spacing:.5px;}
h3{font-family:Georgia,serif;color:var(--ink);margin:14px 0 8px;font-size:17px;}
.sub{color:var(--muted);font-size:13px;margin:-6px 0 12px;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}

/* buttons */
.btn{background:linear-gradient(180deg,#3a2d6e,#241c44);color:var(--ink);border:1px solid var(--line);border-radius:10px;
  padding:10px 16px;font-size:14px;cursor:pointer;font-weight:600;min-height:44px;touch-action:manipulation;}
@media (hover:hover){ .btn:hover{filter:brightness(1.15);} }
.btn.gold{background:linear-gradient(180deg,#e8a33d,#b97a1e);color:#24170a;border-color:#ffd98a;}
.btn.ok{background:linear-gradient(180deg,#2f9e63,#1f6b42);border-color:#6ee7a0;}
.btn.danger{background:linear-gradient(180deg,#b33,#6e1f1f);border-color:#ff6b6b;}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.4);}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px;min-height:34px;}

/* cards */
/* fluid so a 320px phone and a 1200px desktop both get a sensible card */
.card{width:clamp(84px,23vw,108px);border-radius:10px;overflow:hidden;position:relative;border:2px solid #fff;cursor:pointer;
  background:#0c0a1c;box-shadow:0 4px 12px rgba(0,0,0,.5);transition:transform .1s;flex:0 0 auto;}
.card.wide{width:clamp(112px,30vw,150px);}
@media (hover:hover){ .card:hover{transform:translateY(-4px);} }
/* aspect-ratio keeps the art proportional as the card width flexes */
.card .art{aspect-ratio:1.46;height:auto;background:center/cover;position:relative;}
.card.wide .art{aspect-ratio:1.44;height:auto;}
.card .cost{position:absolute;top:4px;left:4px;background:radial-gradient(circle,#6a8cff,#2c3f8a);color:#fff;font-weight:800;
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;border:1px solid #9db4ff;}
.card .atk,.card .hp{position:absolute;bottom:4px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#fff;border:1px solid #fff;}
.card .atk{left:4px;background:#c0392b;}
.card .hp{right:4px;background:#2e9e5b;}
.card .body{padding:5px 6px;}
.card .nm{font-size:12px;font-weight:700;line-height:1.1;min-height:26px;}
.card .tx{font-size:10px;color:var(--muted);line-height:1.2;margin-top:2px;min-height:26px;}
.card .grade{position:absolute;top:4px;right:4px;font-size:14px;background:rgba(0,0,0,.5);border-radius:8px;padding:1px 5px;}
.card .serial{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--gold);background:rgba(0,0,0,.6);border-radius:6px;padding:1px 6px;letter-spacing:1px;font-weight:700;white-space:nowrap;}
.card.slab{border-image:linear-gradient(135deg,#e8c36a,#fff,#7be0ff,#e8c36a) 1;box-shadow:0 0 14px rgba(255,201,77,.55),0 4px 12px rgba(0,0,0,.5);}
.card.slab .art{outline:1px solid rgba(255,215,120,.6);}
.card .val{position:absolute;bottom:4px;right:4px;font-size:10px;color:var(--gold);background:rgba(0,0,0,.55);padding:1px 5px;border-radius:6px;}
.card .slot{position:absolute;top:4px;right:4px;font-size:13px;background:rgba(0,0,0,.5);border-radius:8px;padding:1px 5px;}
.card.sel{outline:3px solid var(--gold);transform:translateY(-6px);}
.card.disabled{opacity:.45;cursor:not-allowed;}
.card.tired{opacity:.6;}
.card .tired-ic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;opacity:.9;text-shadow:0 0 6px #000;}

/* list rows */
.lrow{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel2);flex-wrap:wrap;}
.lrow .grow{flex:1;min-width:120px;}
.lrow .t{font-weight:700;font-size:14px;}
.lrow .d{font-size:12px;color:var(--muted);}
.ic{font-size:20px;}

/* duel */
#duelWrap{display:flex;flex-direction:column;gap:10px;height:100%;}
.duelzone{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);min-height:120px;background:var(--panel);}
.duelzone.bg{background:center/cover url(./assets/duel_bg.jpg);min-height:150px;}
.zonecap{position:absolute;top:6px;left:10px;font-size:12px;color:var(--muted);z-index:2;}
.wizbar{position:absolute;top:6px;right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;z-index:2;}
.wizbar .bar{width:clamp(90px,32vw,150px);height:12px;background:#00000066;border:1px solid #fff3;border-radius:6px;overflow:hidden;}
.wizbar .bar>div{height:100%;background:linear-gradient(90deg,#ff6b6b,#ff9a5a);}
.wizbar .bar.o>div{background:linear-gradient(90deg,#54a0ff,#7aa8ff);}
.board{display:flex;gap:8px;padding:40px 10px 10px;flex-wrap:wrap;justify-content:center;min-height:120px;}
.hand{display:flex;gap:8px;padding:8px;overflow-x:auto;justify-content:center;flex-wrap:wrap;scrollbar-width:none;}
.hand::-webkit-scrollbar{display:none;}
.pipbar{display:flex;gap:4px;align-items:center;padding:6px 10px;}
.pip{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#6a8cff,#2c3f8a);border:1px solid #9db4ff;}
.pip.full{background:radial-gradient(circle,#ffd94a,#c8860a);border-color:#fff0a0;}
#duelLog{font-size:12px;color:var(--muted);min-height:20px;padding:6px 10px;background:var(--panel);border-radius:10px;border:1px solid var(--line);}
#duelStatus{font-size:14px;font-weight:700;color:var(--gold);text-align:center;padding:4px;}

/* progress */
.pbar{height:10px;background:#00000055;border-radius:6px;overflow:hidden;border:1px solid #fff3;}
.pbar>div{height:100%;background:linear-gradient(90deg,#e8a33d,#ffd94a);transition:width .1s;}

/* skill grid */
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;}
.kpi .lv{font-size:26px;font-weight:800;color:var(--gold);}
.kpi .nm{font-size:13px;color:var(--muted);margin-top:2px;}

/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#24170a;color:var(--gold);
  border:1px solid var(--gold);padding:10px 18px;border-radius:10px;font-weight:700;z-index:99;display:none;box-shadow:0 6px 20px #000;}
#err{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3a0f0f;color:#ffb3b3;border:1px solid #ff6b6b;padding:10px 18px;border-radius:10px;font-weight:700;z-index:99;display:none;}

/* ---------------- 3D world HUD ---------------- */
#world{position:absolute;inset:0;width:100%;height:100%;display:block;
  /* the canvas handles its own gestures: never let the browser pan/zoom the page on it */
  touch-action:none;}
#worldHud{position:absolute;top:calc(10px + var(--sat));left:50%;transform:translateX(-50%);
  background:rgba(20,14,40,.8);border:1px solid var(--line);border-radius:12px;padding:6px 14px;
  font-size:13px;font-weight:700;color:var(--gold);display:none;pointer-events:none;z-index:3;
  max-width:min(92%,520px);text-align:center;}
#joy{position:absolute;left:calc(20px + var(--sal));bottom:calc(24px + var(--sab));
  width:min(124px,30vw);height:min(124px,30vw);z-index:4;display:none;touch-action:none;
  border-radius:50%;border:1px solid rgba(255,201,77,.28);background:rgba(20,14,40,.30);
  box-shadow:inset 0 0 24px rgba(0,0,0,.35);transition:background .12s,border-color .12s;}
#joy.active{background:rgba(20,14,40,.5);border-color:rgba(255,201,77,.55);}
#joyKnob{position:absolute;left:50%;top:50%;width:42%;height:42%;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#ffe6a8,#e8a33d 60%,#b97a1e);
  border:1px solid rgba(255,255,255,.55);box-shadow:0 3px 10px rgba(0,0,0,.5);}
#prompt{position:absolute;left:50%;bottom:calc(26px + var(--sab));transform:translateX(-50%);
  z-index:4;display:none;max-width:calc(100% - 32px);}
#prompt .btn{white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.5);}
.worldbtn{position:absolute;right:calc(16px + var(--sar));width:44px;height:44px;border-radius:50%;
  z-index:4;display:none;align-items:center;justify-content:center;font-size:22px;font-weight:800;
  background:rgba(20,14,40,.72);color:var(--gold);border:1px solid var(--line);cursor:pointer;
  touch-action:manipulation;line-height:1;padding:0;}
#zoomIn{bottom:calc(94px + var(--sab));}
#zoomOut{bottom:calc(42px + var(--sab));}
/* the zoom buttons are a desktop/one-handed affordance; pinch covers multi-touch */
body.has-touch .worldbtn{display:flex;}

/* ---------------- responsive ----------------
   Card sizes are fluid (clamp) above, so these breakpoints only handle chrome density and
   the vertical budget — which is what actually breaks on a phone, especially in landscape. */

/* modals: keep them inside the safe area and off the screen edges on small phones */
#objective{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:0 8px 6px;
  background:linear-gradient(90deg,rgba(122,92,255,.22),rgba(122,92,255,.06));
  border:1px solid rgba(160,130,255,.45);border-radius:12px;font-size:13px;}
#objective .obj-tick{font-size:15px;flex:0 0 auto}
#objective .obj-main{flex:1;min-width:0}
#objective .obj-title{font-weight:700;color:var(--gold)}
#objective .obj-why{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#objective button{flex:0 0 auto;font-size:12px;padding:6px 10px;min-height:34px}
@media (max-width:520px){ #objective .obj-why{display:none} }
#schoolPicker>div,#overlay>div{margin-top:max(4vh,var(--sat));margin-bottom:calc(16px + var(--sab));}
@media (max-width:640px){
  #schoolPicker>div{padding:20px 14px;width:auto;margin-left:10px;margin-right:10px;border-radius:18px;}
  #schoolPicker>div>div:first-child{font-size:21px;}
  #overlay>div{margin-left:10px;margin-right:10px;padding:16px 14px;}
  #dialogue>div{padding:18px 16px;}
}

/* phones */
@media (max-width:640px){
  #topbar{gap:6px;padding-left:10px;padding-right:10px;}
  #topbar .logo{font-size:16px;}
  .stat{font-size:13px;padding:4px 10px;}
  .navbtn{min-width:56px;font-size:11px;padding:6px 9px;}
  .navbtn .ic{font-size:18px;}
  #screen{padding:12px 10px calc(36px + var(--sab));}
  .panel{padding:12px;border-radius:12px;}
  h2{font-size:20px;}
  .board{padding:36px 6px 8px;gap:6px;min-height:104px;}
  .duelzone{min-height:104px;}
  .duelzone.bg{min-height:128px;}
  .skillgrid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));}
}

/* small phones (iPhone SE / 320-380px) — the logo is the first thing to go */
@media (max-width:380px){
  #topbar .logo{font-size:0;margin-right:auto;}
  #topbar .logo::before{content:"✦";font-size:20px;}
  .stat{font-size:12px;padding:3px 8px;gap:4px;}
  .navbtn{min-width:50px;font-size:10px;padding:5px 7px;}
  #screen{padding:10px 8px calc(32px + var(--sab));}
  .row{gap:8px;}
  .btn{padding:9px 12px;font-size:13px;}
  .zonecap{font-size:11px;}
}

/* landscape phones: height is the scarce resource, so collapse the chrome hard */
@media (max-height:520px) and (orientation:landscape){
  #topbar{padding-top:calc(4px + var(--sat));padding-bottom:4px;}
  #topbar .logo{font-size:15px;}
  .stat{padding:2px 9px;font-size:12px;}
  #nav{padding:4px 8px;}
  .navbtn{flex-direction:row;gap:6px;min-height:36px;min-width:auto;padding:4px 10px;font-size:11px;}
  .navbtn .ic{font-size:15px;}
  #screen{padding:8px 10px calc(16px + var(--sab));}
  h2{font-size:17px;margin-bottom:8px;}
  h3{font-size:15px;margin:8px 0 6px;}
  .panel{padding:10px;margin-bottom:10px;}
  .board{padding:28px 6px 6px;min-height:88px;}
  .duelzone,.duelzone.bg{min-height:88px;}
  .card{width:clamp(72px,13vw,96px);}
  /* the joystick sits higher so it clears the home indicator in landscape */
  #joy{bottom:calc(12px + var(--sab)) !important;}
}

/* tablets and up: roomier cards, two-up panels where it helps */
@media (min-width:900px){
  .card{width:116px;}
  .card.wide{width:158px;}
  .skillgrid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));}
}

/* respect reduced-motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <div id="topbar">
    <div class="logo">✦ Arcane Legends</div>
    <div class="stat">🪙 <b id="sGold">0</b></div>
    <div class="stat">⭐ <b id="sLvl">1</b></div>
    <div class="stat">🧙 <b id="sXp">0</b></div>
    <button id="muteBtn" class="stat statbtn" aria-label="Toggle sound" onclick="window.__ev('toggleMute')">🔊</button>
  </div>
  <div id="nav"></div>
  <!-- Onboarding objective bar. Present on every screen including the 3D world, because the
       chain sends the player back and forth between them and an objective you can only see on
       one screen is an objective you lose track of. -->
  <div id="objective" style="display:none"></div>
  <!-- The duel arena sits ABOVE the duel UI. Below it, it competed with the player's hand for
       the bottom of the viewport and cut the cards in half. -->
  <div id="battleWrap" style="display:none">
    <canvas id="battle3d"></canvas>
  </div>
  <div id="screen"></div>
  <div id="worldWrap" style="display:none;position:relative;flex:1;overflow:hidden;background:#1a1440">
    <canvas id="world"></canvas>
    <div id="worldHud"></div>
    <div id="joy"><div id="joyKnob"></div></div>
    <div id="prompt"></div>
    <button id="zoomIn" class="worldbtn" aria-label="Zoom in">+</button>
    <button id="zoomOut" class="worldbtn" aria-label="Zoom out">−</button>
  </div>
</div>
<div id="toast"></div>
<div id="err"></div>
<div id="dialogue" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:98;align-items:center;justify-content:center">
  <div style="background:var(--panel);border:1px solid var(--gold);border-radius:18px;max-width:430px;width:92%;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.6)">
    <div id="dlgName" style="color:var(--gold);font-weight:800;font-size:18px;margin-bottom:4px"></div>
    <div id="dlgRole" style="color:var(--muted);font-size:12px;margin-bottom:10px"></div>
    <div id="dlgLines" style="color:var(--ink);font-size:14px;margin-bottom:16px;line-height:1.6"></div>
    <div id="dlgBtns" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </div>
</div>
<div id="overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:97;overflow-y:auto">
  <div style="max-width:760px;margin:16px auto;background:var(--panel);border:1px solid var(--gold);border-radius:18px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.6)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div id="ovTitle" style="color:var(--gold);font-weight:800;font-size:20px"></div>
      <button class="btn sm" onclick="window.__ev('ovClose')">✕ Close</button>
    </div>
    <div id="ovBody"></div>
  </div>
</div>
<div id="schoolPicker" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99;overflow-y:auto">
  <div style="max-width:680px;margin:10vh auto;background:var(--panel);border:1px solid var(--gold);border-radius:22px;padding:30px;text-align:center">
    <div style="color:var(--gold);font-weight:800;font-size:26px">Choose Your School</div>
    <div style="color:var(--muted);font-size:14px;margin-top:8px" id="spSub">Answer a few questions and the Academy will suggest the school that fits you best.</div>
    <div id="spBody" style="margin-top:20px"></div>
  </div>
</div>
<script src="./vendor/three.min.js"></script>
<script src="./vendor/GLTFLoader.js"></script>
<script src="./vendor/DRACOLoader.js"></script>
<script type="module">
import { STR } from "./strings.js";
import { CARDS, CARD_MAP, SCHOOLS, RARITY, GRADES, gradeForRoll, cardValue, gradeFee } from "./cards.js";
import { MATERIALS, BARS, POTIONS, METALS, SLOTS, equipmentFor, HOME_UPGRADES, equipStatsLabel, SKILLS, CARD_MATERIALS } from "./items.js";
import * as G from "./game.js";
import { createWorld } from "./world.js";
import { createAudio, SFX } from "./audio.js";

let toastT;

function buildScribing(){
  let h = `<p class="sub">Refine wood, fish, and ore into card materials, then scribe a spell card. Higher Scribing skill yields better grades.</p><div class="row">`;
  for (const cm of CARD_MATERIALS){
    const sources = cm.from.map(fid=>{ const s=MATERIALS.find(m=>m.id===fid); return s?`${s.icon} ${s.name} (${s.lvl})`:"⚪"; }).join(" · ");

  h += `<div class="panel"><div style="font-weight:700">🪶 Scribe a Spell Card</div><div class="sub">Spend 1 🖼️ Canvas + 1 🖋️ Ink + 1 🧪 Reagent to create a random card (grade 1-10). Grades 9-10 become slabs.</div><button class="btn gold ${canScribe?"":"disabled"}" ${canScribe?"":"disabled"} onclick="window.__ev('scribe')">Scribe · 🖼️${S.inventory.canvas||0} 🖋️${S.inventory.ink||0} 🧪${S.inventory.reagent||0}</button></div>`;

function buildForge(){
  let h = `<p class="sub">Smelt bars and forge equipment to boost your dueling power. Brew potions for extra healing.</p>`;
  h += `<h3>⚒️ Smelt bars</h3><div class="row">`;
  for (const b of BARS){ const req = Object.entries(b.req).map(([id,n])=>`${fname(id)}×${n}`).join(" + "); const ok = G.canCraft(S,b); h += `<div class="panel" style="flex:1;min-width:150px"><div style="font-weight:700">${b.icon} ${b.name}</div><div class="sub">Smelting ${b.lvl} · +${b.xp} xp</div><div class="sub">${req}</div><button class="btn sm ${ok?"ok":""}" ${ok?"":"disabled"} onclick="window.__ev('smelt|${b.id}')">Smelt</button></div>`; }
  h += `</div><h3>⚒️ Forge equipment</h3><div class="row">`;
  for (const metal of Object.keys(METALS)) for (const slot of SLOTS){
    const e = equipmentFor(metal, slot.id); const ok = G.skillLevel(S,"smithing") >= e.lvl && (S.inventory[e.barId]||0) >= e.bars;
    h += `<div class="panel" style="flex:1;min-width:150px"><div style="font-weight:700">${e.icon} ${e.name}</div><div class="sub">Smelting ${e.lvl} · ${e.bars}× ${e.name.split(" ")[0]} bar</div><div class="sub" style="color:var(--gold)">${equipStatsLabel(e)}</div><button class="btn sm ${ok?"ok":""}" ${ok?"":"disabled"} onclick="window.__ev('forge|${e.id}')">Forge</button></div>`;
  }
  h += `</div><h3>⚗️ Brew potions</h3><div class="row">`;
  for (const p of POTIONS){ const ok = G.skillLevel(S,"alchemy") >= p.lvl && G.hasItems(S,p.req); const req = Object.entries(p.req).map(([id,n])=>`${fname(id)}×${n}`).join(" + "); h += `<div class="panel" style="flex:1;min-width:150px"><div style="font-weight:700">${p.icon} ${p.name}</div><div class="sub">Alchemy ${p.lvl} · heals ${p.heal}</div><div class="sub">${req}</div><button class="btn sm ${ok?"ok":""}" ${ok?"":"disabled"} onclick="window.__ev('brew|${p.id}')">Brew</button></div>`; }
  h += `</div>`;
  return h;
}

function cardFace(c, opts={}){
  const school = SCHOOLS[c.school];
  const rarity = RARITY[c.rarity];
  const grade = (opts.grade) ? gradeForRoll(opts.grade) : null;
  const val = (opts.value!=null) ? opts.value : cardValue(c.id, opts.grade!=null?opts.grade:100);
  const cls = ["card"];
  if (opts.wide) cls.push("wide");
  if (opts.sel) cls.push("sel");
  if (opts.disabled) cls.push("disabled");
  if (opts.tired) cls.push("tired");
  if (opts.slab) cls.push("slab");
  const art = school.art;
  let flag = "";
  if (opts.tired) flag = `<div class="tired-ic">😴</div>`;
  let attrs = "";
  if (opts.onclick) attrs = ` onclick="window.__ev('${opts.onclick}')"`;
  return `<div class="${cls.join(" ")}" style="border-color:${rarity.color}" ${attrs}>
    <div class="art" style="background-image:url(./assets/${art})">
      <div class="cost">${c.cost}</div>
      ${c.type==="creature" ? `<div class="atk">${c.atk}</div><div class="hp">${c.hp}</div>` : ""}
      ${grade ? `<div class="grade" title="${grade.name}">${grade.icon}</div>` : ""}
      ${opts.slab ? `<div class="serial">#${opts.serial}</div>` : ""}
      ${opts.value!=null ? `<div class="val">🪙${val}</div>` : ""}
      ${flag}
    </div>
    <div class="body">
      <div class="nm">${c.name}</div>
      <div class="tx">${c.text||""}</div>
    </div>
  </div>`;
}

const NAV = [
  ["world","🌍","World"],["home","🏰",STR.nav_home],["skills","⛏️",STR.nav_skills],["collection","🃏",STR.nav_collection],
  ["loadout","🗡️",STR.nav_loadout],["market","🛒",STR.nav_market],["quests","📜",STR.nav_quests],["pvp","⚔️",STR.nav_pvp],

// Onboarding objective bar. Rebuilt on every render because every step is DERIVED from the save
// (see onboarding.js) — there is no state here to keep in sync, it just re-asks the questions.
function buildObjective(){
  const bar = $("objective");
  const step = ONBOARD.currentStep(S);
  if (!step || S.flags.onboardingHidden){ bar.style.display = "none"; return; }
  const p = ONBOARD.progress(S);
  const where = step.where ? ` — ${step.where}` : "";
  const canGo = step.goto && step.goto !== screen && step.goto !== "duel";
  bar.innerHTML =
    `<span class="obj-tick">🎓</span>` +
    `<span class="obj-main"><div class="obj-title">${p.index}/${p.total} · ${step.title}</div>` +
    `<div class="obj-why">${step.why}${where}</div></span>` +
    (canGo ? `<button class="btn gold" onclick="window.__ev('objGo')">Go</button>` : ``) +
    `<button class="btn" onclick="window.__ev('objHide')" aria-label="Hide guide">✕</button>`;
  bar.style.display = "flex";
}
window.__EV.objGo = ()=>{
  const step = ONBOARD.currentStep(S);
  if (!step) return;
  screen = step.goto === "world" ? "world" : step.goto;
  render();
};
window.__EV.objHide = ()=>{ S.flags.onboardingHidden = true; save(); render(); };

function buildNav(){
  $("nav").innerHTML = NAV.map(([id,ic,label])=>`<button class="navbtn ${id===screen?"on":""}" data-screen="${id}"><span class="ic">${ic}</span>${label}</button>`).join("");
  document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{ screen=b.dataset.screen; render(); });
}
function render(){
  AUDIO.setContext(screen === "world" ? "world" : (screen === "duel" || screen === "online") ? "duel" : "menu");
  buildNav();
  buildObjective();
  const scr = $("screen");
  const worldWrap = $("worldWrap");
  const battleWrap = $("battleWrap");
  if (screen==="world"){
    scr.style.display = "none";
    worldWrap.style.display = "block";
    battleWrap.style.display = "none";
    if (battle3d) battle3d.stop();
    if (world) world.resize();
    refreshTop();
    return;
  }
  scr.style.display = "block";
  worldWrap.style.display = "none";
  if (screen==="duel"){
    battleWrap.style.display = "block";
    syncBattle3d();
  } else {
    battleWrap.style.display = "none";
    if (battle3d) battle3d.stop();
  }
  scr.innerHTML = `<div class="screen on" id="scr_${screen}"></div>`;
  const el = $(`scr_${screen}`);
  if (screen==="home") renderHome(el);
  if (screen==="skills") renderSkills(el);
  if (screen==="collection") renderCollection(el);
  if (screen==="loadout") renderLoadout(el);
  if (screen==="market") renderMarket(el);
  if (screen==="quests") renderQuests(el);
  if (screen==="pvp") renderPvp(el);
  if (screen==="duel") renderDuel(el);
  if (screen==="online") renderOnline(el);
  save();
}

// Sync the 3D duel arena to the battle board (summon/remove creatures as played).
function syncBattle3d(){
  try {
    if (!battle) return;
    const cv = $("battle3d");
    if (!cv) return;
    if (!battle3d) window.__battle3d = battle3d = createBattle3d(cv);
    const r = cv.parentElement.getBoundingClientRect();
    battle3d.setSize(r.width, r.height);
    battle3d.sync(battle.you.board, battle.enemy.board);
    battle3d.start();
  } catch(e){ console.warn("3D battle unavailable:", e); }
}
function startPracticeDuel(){

  // ensure deck valid
  if (S.deck.length !== G.MAX_DECK){ err(STR.deck_need); return; }
  const enemyHp = isQuest ? G.QUESTS[questIdx].hp : 100;
  const enemySchool = isQuest ? G.QUESTS[questIdx].school : "balance";

function renderDuel(el){
  if (!battle){ el.innerHTML = `<h2>Duel</h2>${G.isOver(battle||{}).over?"":""}`; return; }
  const over = G.isOver(battle);
  const you = battle.you, enemy = battle.enemy;
  const myTurn = battle.turn==="you";
  let h = `<h2>⚔️ ${battle.enemyName||"Duel"}</h2>`;
  const resultText = over.draw ? STR.you_draw : (over.winner==="you" ? STR.you_win : STR.you_lose);
  h += `<div id="duelStatus">${over.over ? resultText : (myTurn?STR.your_turn:STR.enemy_turn)}</div>`;
  if (over.over && over.reason === "turn limit") h += `<div style="text-align:center;font-size:12px;color:var(--muted)">${STR.turn_limit}</div>`;
  h += `<div id="duelTimer" style="text-align:center;font-size:20px;font-weight:800;color:${duelTimeLeft<=10?"var(--danger)":"var(--gold)"}">${myTurn&&!over.over?duelTimeLeft+"s":"—"}</div>`;
  h += `<div style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:6px">You: ${(you.field||[]).map(f=>CARD_MAP[f.id].name).join(" · ")||"no field"} ${(you.traps||[]).length?`· 🪤${you.traps.length}`:""} &nbsp;|&nbsp; Enemy: ${(enemy.field||[]).map(f=>CARD_MAP[f.id].name).join(" · ")||"no field"} ${(enemy.traps||[]).length?`· 🪤${enemy.traps.length}`:""}</div>`;
  h += `<div style="text-align:center;font-size:12px;color:var(--gold);margin-bottom:6px">🎓 ${SCHOOLS[you.school].name} School vs ${SCHOOLS[enemy.school].name} School</div>`;
  // enemy zone
  const canTargetWiz = pendingTarget && (pendingTarget.kind==="spell" || pendingTarget.kind==="attack");
  h += `<div class="duelzone bg"><div class="zonecap">${battle.enemyName||"Enemy"}</div>`;
  h += `<div class="wizbar" ${canTargetWiz?`style="cursor:crosshair" onclick="window.__ev('dmgWiz')"`:""}><div class="bar"><div style="width:${Math.max(0,enemy.hp/enemy.maxHp*100)}%"></div></div>
    <div style="font-size:12px">${enemy.hp}/${enemy.maxHp} HP${enemy.shield?` · 🛡${enemy.shield}`:""}</div></div>`;
  h += `<div class="board">`;
  for (let i=0;i<enemy.board.length;i++){
    const c = enemy.board[i]; const def = CARD_MAP[c.id];
    h += cardFace(def, { sel:false, tired:c.exhausted||c.summoning,
      onclick: pendingTarget ? `dmgTarget|${i}` : "" });
  }
  h += `</div></div>`;
  // your zone
  h += `<div class="duelzone"><div class="zonecap">You · ${you.pips} ⚡ pips</div>`;
  h += `<div class="wizbar"><div class="bar o"><div style="width:${Math.max(0,you.hp/you.maxHp*100)}%"></div></div>
    <div style="font-size:12px">${you.hp}/${you.maxHp} HP${you.shield?` · 🛡${you.shield}`:""}</div></div>`;
  h += `<div class="board">`;
  for (let i=0;i<you.board.length;i++){
    const c = you.board[i]; const def = CARD_MAP[c.id];
    const canAtk = myTurn && !c.exhausted && !c.summoning;
    h += cardFace(def, { sel: pendingTarget&&pendingTarget.kind==="attack"&&pendingTarget.idx===i,
      tired:c.exhausted||c.summoning, onclick: canAtk ? `atkFrom|${i}` : "" });
  }
  h += `</div></div>`;
  // hand
  h += `<div class="panel"><div class="zonecap" style="position:static">${STR.hand} (${you.hand.length})</div><div class="hand">`;
  for (let i=0;i<you.hand.length;i++){
    const id = you.hand[i]; const c = CARD_MAP[id];
    const playable = myTurn && you.pips>=c.cost && !over.over;
    const isTargeted = c.type==="spell" && c.fx.some(f=>f.k==="dmg");
    h += cardFace(c, { sel: pendingTarget&&pendingTarget.kind==="spell"&&pendingTarget.idx===i,
      disabled: !playable, onclick: playable ? (isTargeted?`cast|${i}`:`play|${i}`) : "" });
  }
  h += `</div></div>`;
  // potions (brewed via Alchemy — 1 pip, one per turn)
  const potions = G.heldPotions(S);
  if (potions.length){
    h += `<div class="row" style="justify-content:center;flex-wrap:wrap;gap:6px">`;
    for (const p of potions){
      const usable = myTurn && !over.over && !you.potionUsed && you.pips >= 1;
      h += `<button class="btn ${usable?"ok":""}" ${usable?"":"disabled"} onclick="window.__ev('drink|${p.id}')">${p.icon} ${p.name.replace(" Healing Potion","")} +${p.heal} ×${p.count}</button>`;
    }
    h += `</div>`;
    if (you.potionUsed) h += `<div style="text-align:center;font-size:11px;color:var(--muted)">${STR.potion_used}</div>`;
  }
  // actions
  h += `<div class="row" style="justify-content:center">
    <button class="btn gold" ${myTurn&&!over.over?"":"disabled"} onclick="window.__ev('endTurn')">${STR.end_turn}</button></div>`;
  h += `<div id="duelLog">${battle.log.slice(-4).join(" · ")}</div>`;
  if (over.over){
    h += `<div class="row" style="justify-content:center;margin-top:8px">
      <button class="btn ok" onclick="window.__ev('duelAgain')">${STR.play_again}</button>
      <button class="btn" onclick="window.__ev('toPvp')">Exit</button></div>`;
  }
  el.innerHTML = h;
  // turn timer: clear always; start countdown when it's the player's turn
  clearInterval(duelTimerInt);
  if (!over.over && battle.turn==="you"){
    duelTimeLeft = 30;
    duelTimerInt = setInterval(()=>{
      if (!battle || battle.turn!=="you" || G.isOver(battle).over){ clearInterval(duelTimerInt); return; }
      duelTimeLeft--;
      const el = document.getElementById("duelTimer");
      if (el){ el.textContent = duelTimeLeft+"s"; el.style.color = duelTimeLeft<=10 ? "var(--danger)" : "var(--gold)"; }
      if (duelTimeLeft <= 0){ clearInterval(duelTimerInt); G.endTurn(battle); render(); }
    }, 1000);
  }
  // if it's enemy turn and not over, run AI
  if (!over.over && battle.turn==="enemy"){
    setTimeout(()=>{ if (battle && battle.turn==="enemy"){
      // Watch the log rather than reimplementing the AI: aiTurn appends "<who> plays <name>" for
      // every card it casts, which is the only record of what it actually did.
      const before = battle.log.length;
      G.aiTurn(battle);
      for (const line of battle.log.slice(before)){
        const m = /plays (.+)$/.exec(line);
        if (!m) continue;
        const card = CARDS.find(c => c.name === m[1]);
        if (card) castVfx(card.id, "enemy", null);
      }
      render();
    } }, 500);
  }
}
// Spell VFX. The card has to be captured BEFORE playCard, because playing it removes it from
// hand — reading hand[idx] afterwards gets whatever slid into that slot.
function castVfx(cardId, side, targetIdx){

}

window.__EV.dmgWiz = ()=>{

window.__EV.atkFrom = (idx)=>{

window.__EV.atkWiz = ()=>{
  if (pendingTarget && pendingTarget.kind==="attack"){ const r=G.attack(battle, pendingTarget.idx, "wiz", -1); pendingTarget=null; if(r.ok) sfx(dmgSfx); render(); }

window.__EV.drink = (potionId)=>{

window.__EV.endTurn = ()=>{ const r=G.endTurn(battle); render(); };
window.__EV.duelAgain = ()=>{

  if (over.winner==="you"){
    G.dailyProgress(S, "win");
    if (dungeonFoe){
      // WORLDSPEC §6: dungeon progress persists, so a cleared dungeon stays cleared.

      const firstBossKill = dungeonFoe.boss && !st.bossDead;

function setupOnline(){

function renderOnline(el){

      for (let i=0;i<v.opp.board.length;i++){ const c=v.opp.board[i]; const def=CARD_MAP[c.id]; h += cardFace(def,{tired:c.exhausted||c.summoning, onclick: (pendingTarget&&pendingTarget.kind==="attack")?`oDmg|${i}`:""}); }
      h += `</div></div>`;
      // your board

      for (let i=0;i<v.you.board.length;i++){ const c=v.you.board[i]; const def=CARD_MAP[c.id]; const canAtk=myTurn&&!c.exhausted&&!c.summoning; h += cardFace(def,{tired:c.exhausted||c.summoning, onclick: canAtk?`oAtk|${i}`:""}); }
      h += `</div></div>`;

      for (let i=0;i<v.you.hand.length;i++){ const id=v.you.hand[i]; const c=CARD_MAP[id]; const playable=myTurn&&v.you.pips>=c.cost; const targeted=c.type==="spell"&&c.fx.some(f=>f.k==="dmg"); h += cardFace(c,{disabled:!playable, onclick: playable?(targeted?`oCast|${i}`:`oPlay|${i}`):""}); }
      h += `</div></div>`;

function sendOnline(obj){ if (online && online.ws && online.ws.readyState===1) online.ws.send(JSON.stringify(obj)); }
function connectOnline(){
  const base = location.pathname.replace(/\/+$/,"");
  const wsUrl = (location.protocol==="https:"?"wss://":"ws://") + location.host + base + "/ws/" + online.room;
  online.ws = new WebSocket(wsUrl);
  online.ws.onopen = ()=>{ sendOnline({type:"join", playerId: online.playerId}); sendOnline({type:"action", action:{type:"setDeck", deck: online.deck}}); };
  online.ws.onclose = ()=>{ setTimeout(connectOnline, 1500); };
  online.ws.onmessage = (e)=>{
    const msg = JSON.parse(e.data);
    if (msg.type==="error"){ err(msg.error); return; }
    if (msg.type!=="state") return;
    online.state = msg;
    if (msg.status==="over" && !online.rewarded){
      online.rewarded = true;
      if (msg.result.winner===msg.you){ S.pvp.wins++; G.gainGold(S, 60); toast("+60g online win!"); }
      else S.pvp.losses++;
      save();
    }
    renderOnline();
  };
}
window.__EV.oPlay = (i)=>{ sendOnline({type:"action", action:{type:"play", handIndex: i}}); };
window.__EV.oCast = (i)=>{ const c=CARD_MAP[online.state.view.you.hand[i]]; if(c.fx.some(f=>f.k==="dmg")){ pendingTarget={kind:"oSpell", idx:i}; } else sendOnline({type:"action",action:{type:"play",handIndex:i}}); };
window.__EV.oDmg = (ti)=>{ if(pendingTarget&&pendingTarget.kind==="oSpell"){ sendOnline({type:"action",action:{type:"play",handIndex:pendingTarget.idx,target:{kind:"creature",idx:ti}}}); pendingTarget=null; } else if(pendingTarget&&pendingTarget.kind==="oAtk"){ sendOnline({type:"action",action:{type:"attack",attacker:pendingTarget.idx,targetKind:"creature",targetIdx:ti}}); pendingTarget=null; } };
window.__EV.oAtk = (i)=>{ const v=online.state.view; const hasTaunt=v.opp.board.some(c=>c.taunt&&c.hp>0); if(hasTaunt){ pendingTarget={kind:"oAtk",idx:i}; } else sendOnline({type:"action",action:{type:"attack",attacker:i,targetKind:"wiz"}}); };
window.__EV.oEnd = ()=>{ sendOnline({type:"action",action:{type:"endTurn"}}); };
window.__EV.oReset = ()=>{ sendOnline({type:"reset"}); online.rewarded=false; };

// ================= WORLD (3D hub) =================
let world = null, worldPrompt = null;
function stationTarget(station){
  return { scribe:"skills", smith:"skills", market:"market", duel:"pvp", quests:"quests", home:"home" }[station] || "home";
}
const NPC_DIALOGUE = {
  quests: { name:"Professor Echo", role:"Dean of the Arcanum", lines:["Welcome to the Arcanum Academy, young spellwright.","The rivals of the seven schools await. Defeat them to earn renown, gold, and rare cards."], buttons:[{label:"📜 View Quests", primary:true, action:()=>{screen="quests";render();}}] },
  market: { name:"Merchant Vell", role:"Arcade Stalls", lines:["Fresh goods from the Merchant Arcade!","Cards, materials, and rare finds — coin well spent."], buttons:[{label:"🛒 Open Market", primary:true, action:()=>{screen="market";render();}}] },
  duel: { name:"Referee Kael", role:"Arena Master", lines:["The arena is open. Challenge an AI rival or duel a real player for glory."], buttons:[{label:"⚔️ Enter the Arena", primary:true, action:()=>{screen="pvp";render();}}] },
  scribe: { name:"Scribing Hall", role:"Card Creation", lines:["Refine wood, fish, and ore into canvas, ink, and reagent, then scribe spell cards."], buttons:[{label:"🪶 Scribe & Refine", primary:true, action:()=>{ showOverlay("Scribing Hall", buildScribing()); }}] },

  home: { name:"Student Dorms", role:"Your Home", lines:["Your own corner of the academy. Upgrade your guild hall."], buttons:[{label:"🏰 Your Hall", primary:true, action:()=>{screen="home";render();}}] },

  librarian: { name:"Librarian Ossa", role:"Keeper of the Library of Echoes", lines:["The Library of Echoes holds every lesson and challenge record of the Arcanum.","Take on the day's challenge when you're ready, young spellwright."], buttons:[{label:"📜 Daily Challenge", primary:true, action:()=>{screen="quests";render();}}] },
};
const isTouchDevice = ("ontouchstart" in window) || (navigator.maxTouchPoints||0) > 0;
// The active zone config (WORLDSPEC step 1). Loaded before the world is built; if the fetch
// fails the world falls back to its built-in academy tables rather than not booting at all.
let worldCfg = null, activeZone = null;
// Build (or REBUILD) the 3D world for a zone. Extracted from initWorld so a zone transition can
// tear the scene down and stand a new one up without duplicating the callback wiring — and,
// importantly, without re-attaching the input listeners: every handler below closes over the
// module-level `world`, so rebinding it is enough.
function spawnWorld(canvas, zone, spawnAt){
  return createWorld(canvas, {
    onNearby(target){
      worldPrompt = target;
      const p = $("prompt");
      if (target){
        const isNPC = target.kind==="station" && NPC_DIALOGUE[target.data];
        p.innerHTML = `<button class="btn gold" onclick="window.__ev('worldGo')">${target.kind==="gather"?"⛏️":(isNPC?"💬":"🚪")} ${target.label}</button>`;
        p.style.display = "block";
      } else p.style.display = "none";
    },
    onGather(matId){
      if (gatherCooldown>0) return;
      const m = MATERIALS.find(x=>x.id===matId);
      if (!m) return;
      const r = G.gather(S, m);
      if (r.ok){ toast(`${m.icon} +${m.name} (+${r.xp} xp)`); AUDIO.play("gather"); gatherCooldown = 1.4; }
      else err(LTL);
      save();
    },
    onLoadProgress(st){
      // Say what the world is doing instead of showing placeholder wizards with no explanation.
      const hud = $("worldHud");
      if (st.done < st.total){
        hud.textContent = STR.world_loading.replace("{d}", st.done).replace("{t}", st.total);
        hud.style.opacity = "1"; hud.style.display = "block";
      } else {
        if (st.failed.length){
          hud.textContent = STR.world_load_partial.replace("{n}", st.failed.length);
          console.warn("character models that failed to load:", st.failed.join(", "));
        } else {
          hud.textContent = isTouchDevice ? STR.world_hint_touch : STR.world_hint_desktop;
        }
        hud.style.opacity = "1";
        setTimeout(()=>{ hud.style.transition = "opacity .6s"; hud.style.opacity = "0"; }, 4000);
      }
    },
    onStation(station){
      const dlg = NPC_DIALOGUE[station];
      if (dlg){ showDialogue(dlg.name, dlg.role, dlg.lines, dlg.buttons); }
      else { screen = stationTarget(station); render(); }
    },
    onZoneExit(e){ changeZone(e.toZone, e.fromZone); },
    onDungeon(id){ enterDungeon(id); },
    onEnemy(name){ startDungeonFight(name); },
  }, zone, {
    spawnAt,
    // enemies this save has already killed — they must not respawn on re-entry
    defeated: (S.worldState.dungeons[zone.id] || {}).defeated || [],
    zoneNames: worldCfg ? Object.fromEntries(worldCfg.zoneIds.map(id => [id, worldCfg.get(id).name])) : {},
  });
}

// WORLDSPEC step 4. Tears the current zone's scene down and builds the target zone, dropping the
// player at the reciprocal exit so the two zones join up. Guarded by `zoning` because the world
// keeps running (and can fire the trigger again) during the rebuild.
let zoning = false;
// WORLDSPEC step 5. Dungeons are compiled into ZONES (see dungeons.js) and registered alongside
// the outdoor ones, so entering and leaving one is the step-4 transition path — no separate
// suspend/restore machinery, and the save already records which zone the player is in.
function enterDungeon(id){
  if (!worldCfg || !worldCfg.get(id)){ console.warn("unknown dungeon", id); return; }
  S.worldState.dungeons = S.worldState.dungeons || {};
  S.worldState.dungeons[id] = S.worldState.dungeons[id] || { cleared: [], defeated: [], bossDead: false };
  changeZone(id, activeZone && activeZone.id);
}
// Bumping into a dungeon enemy starts a duel. The enemy's level picks the quest deck it fights
// with, so a Lv3 slime is not shuffling the Archon's endgame list.
function startDungeonFight(id){
  const zone = activeZone;
  const foe = (zone && zone.enemies || []).find(e => e.id === id);
  if (!foe) return;
  const tier = Math.max(0, Math.min(G.QUESTS.length - 1, Math.floor((foe.level || 1) / 2)));
  const q = G.QUESTS[tier];
  startLocalDuel(q.deck, q.gear, foe.name, tier, false);
  // Remembered on the battle so the reward/persistence step knows what was actually beaten.
  battle.dungeonFoe = { zone: zone.id, id: foe.id, room: foe.room, boss: !!foe.boss };
}
// Record a dungeon kill: remove it from the world, persist it, and mark the room cleared once
// nothing in it is left standing.
function recordDungeonKill(foe){
  const st = (S.worldState.dungeons[foe.zone] = S.worldState.dungeons[foe.zone] ||
              { cleared: [], defeated: [], bossDead: false });
  if (st.defeated.includes(foe.id)) return;
  st.defeated.push(foe.id);
  if (world && world.removeEnemy) world.removeEnemy(foe.id);
  const zone = worldCfg && worldCfg.get(foe.zone);
  if (zone){
    const left = zone.enemies.filter(e => e.room === foe.room && !st.defeated.includes(e.id));
    if (!left.length && !st.cleared.includes(foe.room)){
      st.cleared.push(foe.room);
      toast("✨ Room cleared: " + foe.room);
    }
  }
}
function changeZone(toZoneId, fromZoneId){
  if (zoning || !worldCfg) return;
  const target = worldCfg.get(toZoneId);
  if (!target){ console.warn("exit to unknown zone", toZoneId); return; }
  zoning = true;
  const canvas = $("world");
  const spawnAt = entryPointFor(worldCfg, toZoneId, fromZoneId);
  try {
    // Dispose FIRST: two live worlds would each hold a WebGL context on the same canvas and
    // both would keep running their rAF loops.
    if (world) world.dispose();
    // Clear the interaction prompt by hand. It is DOM that outlives the scene, so without this
    // the new zone opens showing the OLD zone's prompt — arriving in the forest still offered
    // "To Whispering Forest" from the academy gateway we just walked through.
    worldPrompt = null;
    $("prompt").style.display = "none";
    activeZone = target;
    world = spawnWorld(canvas, target, spawnAt);
    window.__world = world;
    world.setPlayerColor(SCHOOLS[S.school].color);
    world.resize();
    S.worldState.zone = toZoneId;
    if (!S.worldState.visited.includes(toZoneId)) S.worldState.visited.push(toZoneId);
    save();
    toast("🚪 " + target.name);
    AUDIO.play("zone");
  } catch(err){
    console.warn("zone transition failed:", err);
  } finally { zoning = false; }
}

async function initWorld(){
  const canvas = $("world");
  try {
    worldCfg = await loadWorldConfig();
    // Dungeons are compiled to zones and merged into the same lookup, so `changeZone`,
    // `entryPointFor` and the zone-name labels all work on them without knowing they are
    // interiors. Failing to load them must not take the outdoor world down with it.
    try {
      for (const d of await loadDungeons()){
        const z = dungeonZone(d);
        worldCfg.zones[z.id] = z;
        if (!worldCfg.zoneIds.includes(z.id)) worldCfg.zoneIds.push(z.id);
      }
    } catch(e){ console.warn("dungeons unavailable:", e && e.message); }
    // ?zone= wins, then wherever the player last logged out, then the hub.
    const wanted = new URLSearchParams(location.search).get("zone") || (S.worldState && S.worldState.zone);
    activeZone = (wanted && worldCfg.get(wanted)) || worldCfg.get(worldCfg.hub);
    if (wanted && !worldCfg.get(wanted)) console.warn("unknown zone \"" + wanted + "\", using the hub");
  } catch(e){
    console.warn("world config unavailable, using built-in academy:", e && e.message);
  }
  try {
    world = spawnWorld(canvas, activeZone, null);
  } catch(e){ console.warn("3D world unavailable:", e); return; }
  // Exposed for tools/browser-test.mjs, which drives the real input/collision paths that the
  // headless smoke test cannot reach (createWorld needs WebGL).
  window.__world = world;
  // ---------------- world input ----------------
  // Unified on Pointer Events so mouse, touch and pen all take the same path. Every gesture is
  // tracked by pointerId, which is what makes "drag to rotate" and "pinch to zoom" coexist:
  // the old code tracked a single drag and kept rotating the camera during a two-finger pinch.
  const isTouch = isTouchDevice;
  if (isTouch) document.body.classList.add("has-touch");

  // ---- joystick ----
  const joy = $("joy"), knob = $("joyKnob");
  let joyId = null, joyBase = null, joyRadius = 46;
  function joySet(dx, dy){
    world.setTouchMove(dx, dy);
    // the knob follows the finger, clamped to the ring, so the control reads as analogue
    knob.style.transform = `translate(calc(-50% + ${dx*joyRadius}px), calc(-50% + ${dy*joyRadius}px))`;
  }
  function joyStart(e){
    if (joyId !== null) return;
    joyId = e.pointerId;
    const r = joy.getBoundingClientRect();
    joyBase = { x:r.left+r.width/2, y:r.top+r.height/2 };
    joyRadius = r.width * 0.29;            // how far the knob may travel from centre
    joy.classList.add("active");
    try { joy.setPointerCapture(e.pointerId); } catch(_){}
    joyMove(e);
    e.preventDefault();
  }
  function joyMove(e){
    if (joyId !== e.pointerId || !joyBase) return;
    // normalise against the ring radius, then clamp to the unit circle (not a square) so
    // diagonal input isn't faster than cardinal input
    let dx = (e.clientX-joyBase.x)/(joyRadius*1.6);
    let dy = (e.clientY-joyBase.y)/(joyRadius*1.6);
    const len = Math.hypot(dx, dy);
    if (len > 1){ dx/=len; dy/=len; }
    if (len < 0.12){ dx = 0; dy = 0; }     // small dead zone stops drift on a resting thumb
    joySet(dx, dy);
    e.preventDefault();
  }
  function joyEnd(e){
    if (joyId !== null && e && e.pointerId !== joyId) return;
    joyId = null; joyBase = null;
    joy.classList.remove("active");
    joySet(0, 0);
  }
  joy.addEventListener("pointerdown", joyStart);
  joy.addEventListener("pointermove", joyMove);
  joy.addEventListener("pointerup", joyEnd);
  joy.addEventListener("pointercancel", joyEnd);
  joy.addEventListener("lostpointercapture", joyEnd);

  // ---- camera drag / pinch / tap-to-move ----
  const pointers = new Map();            // active pointers on the canvas, by id
  let dragId = null, dragMoved = false, lastX = 0, lastY = 0, startX = 0, startY = 0, pinchDist = 0, downAt = 0;
  const TAP_SLOP = 8, TAP_MS = 350;      // a tap is a short press that barely moves

  canvas.addEventListener("pointerdown", e=>{
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pointers.size === 1){
      dragId = e.pointerId; dragMoved = false; downAt = performance.now();
      lastX = startX = e.clientX; lastY = startY = e.clientY;
      try { canvas.setPointerCapture(e.pointerId); } catch(_){}
    } else if (pointers.size === 2){
      // a second finger turns the gesture into a pinch: stop rotating and never fire a tap
      dragId = null; dragMoved = true;
      pinchDist = spread();
    }
    e.preventDefault();
  });

  function spread(){
    const [a,b] = [...pointers.values()];
    return Math.hypot(a.x-b.x, a.y-b.y);
  }

  canvas.addEventListener("pointermove", e=>{
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pointers.size === 2){
      const d = spread();
      if (pinchDist) world.zoomCam(pinchDist - d);   // pinch in = zoom out
      pinchDist = d;
      return;
    }
    if (e.pointerId !== dragId) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    // once the press has travelled past the tap slop it becomes a rotate and stays one
    if (!dragMoved && Math.hypot(e.clientX-startX, e.clientY-startY) > TAP_SLOP) dragMoved = true;
    if (dragMoved && world) world.rotateCam(dx);
    lastX = e.clientX; lastY = e.clientY;
  });

  function pointerDone(e){
    const wasDrag = e.pointerId === dragId;
    const quick = performance.now() - downAt < TAP_MS;
    pointers.delete(e.pointerId);
    if (wasDrag && !dragMoved && quick && e.type === "pointerup" && world){
      world.tapAt(e.clientX, e.clientY);            // tap-to-move
    }
    if (wasDrag) dragId = null;
    if (pointers.size < 2) pinchDist = 0;
    // one finger lifted from a pinch: hand the drag to the finger still down, without
    // treating the transition as a tap
    if (pointers.size === 1 && dragId === null){
      const [id, pt] = [...pointers.entries()][0];
      dragId = id; dragMoved = true; lastX = startX = pt.x; lastY = startY = pt.y;
    }
  }
  canvas.addEventListener("pointerup", pointerDone);
  canvas.addEventListener("pointercancel", pointerDone);

  // desktop: wheel to zoom
  canvas.addEventListener("wheel", e=>{ if (world){ world.zoomCam(e.deltaY * 0.6); e.preventDefault(); } }, {passive:false});
  // on-screen zoom buttons (one-handed / no-wheel fallback)
  const holdZoom = (el, dir) => {
    let t = null;
    const go = e => { e.preventDefault(); world && world.zoomCam(dir*18); t = setInterval(()=>world && world.zoomCam(dir*8), 90); };
    const stop = () => { clearInterval(t); t = null; };
    el.addEventListener("pointerdown", go);
    el.addEventListener("pointerup", stop);
    el.addEventListener("pointercancel", stop);
    el.addEventListener("pointerleave", stop);
  };
  holdZoom($("zoomIn"), -1); holdZoom($("zoomOut"), 1);

  // keep the renderer matched to the element, including on orientation change / chrome collapse
  const resizeWorld = () => world && world.resize();
  window.addEventListener("orientationchange", ()=>setTimeout(resizeWorld, 250));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resizeWorld);

  if (isTouch) joy.style.display = "block";
  const hud = $("worldHud");
  if (!hud.textContent) hud.textContent = isTouch ? STR.world_hint_touch : STR.world_hint_desktop;
  hud.style.display = "block";
}
window.__EV.worldGo = ()=>{ if (world) world.trigger(); };
// Test hooks for tools/browser-test.mjs. They drive the REAL functions rather than reimplementing
// them, so the test cannot pass against a path the game does not actually use.
window.__testBattle = ()=> battle;
window.__testGather = ()=>{ const m = MATERIALS.find(x=>x.id==="oak_log"); G.gather(S, m); save(); };
window.__testDuel = ()=>{ startPracticeDuel(); };
window.__testBoard = ()=>{
  battle.you.pips = 9; battle.enemy.pips = 9;
  battle.you.hand[0] = "fire_dragon"; window.__ev("play|0");
  battle.you.hand[0] = "fire_cat"; window.__ev("play|0");
  battle.enemy.hand[0] = "ice_golem"; G.playCard(battle, battle.enemy, 0, null);
  syncBattle3d();
  return { you: battle.you.board.length, enemy: battle.enemy.board.length };
};
// Force a specific card into hand and cast it — used to photograph and test each VFX archetype
// without having to play a real duel until the right card is drawn.
window.__testCast = (cardId, targetIdx)=>{
  if (!battle) return false;
  battle.you.hand[0] = cardId; battle.you.pips = 9;
  castVfx(cardId, "you", targetIdx == null ? null : targetIdx);
  return true;
};
window.__testKill = ()=>{ if (battle && battle.dungeonFoe){ recordDungeonKill(battle.dungeonFoe); save(); } };
window.__EV.toggleMute = ()=>{
  AUDIO.unlock();
  AUDIO.setMuted(!AUDIO.isMuted());
  const b = $("muteBtn");
  b.textContent = AUDIO.isMuted() ? "🔇" : "🔊";
  if (!AUDIO.isMuted()) AUDIO.play("ui");
  toast(AUDIO.isMuted() ? STR.sound_off : STR.sound_on);
};

// ================= boot =================
async function boot(){
  $("muteBtn").textContent = AUDIO.isMuted() ? "🔇" : "🔊";
  await initWorld();
  if (world) world.setPlayerColor(SCHOOLS[S.school].color);
  if (!S.flags.schoolPicked) showSchoolPicker();
  // online room from URL
  const roomParam = new URLSearchParams(location.search).get("room");
  if (roomParam){
    online = { playerId: sessionStorage.getItem("mp-player-id")||("p-"+Math.random().toString(36).slice(2,10)),
      room: roomParam, ws:null, state:null, deck: S.deck.slice() };
    sessionStorage.setItem("mp-player-id", online.playerId);
    if (S.deck.length===G.MAX_DECK){ screen="online"; connectOnline(); }
  }
  render();
  // gather cooldown tick
  setInterval(()=>{ if (gatherCooldown>0) gatherCooldown-=0.1; }, 100);
  // auction tick
  setInterval(()=>{ if (screen==="market") render(); }, 1000);
  setInterval(()=>{ G.save(S); }, 3000);
}
boot();
</script>
