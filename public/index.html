<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1440">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./assets/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<title>Arcane Legends — Wizard TCG</title>
<style>
:root{
  --gold:#ffc94d; --gold2:#e8a33d; --violet:#2a1f4d; --panel:#1a1430; --panel2:#241c44;
  --ink:#f2ecff; --muted:#a99fc9; --line:rgba(255,201,77,.25);
  --danger:#ff6b6b; --ok:#6ee7a0; --info:#7aa8ff;
  /* School accent (set from JS — applyAccent() — to the player's chosen school colour, defaulting
     to gold here so an old save or the pre-boot flash of the page still looks like today). Only
     the chrome (top bar, active nav) wears it — panels stay neutral so it reads as identity, not
     a full reskin every time someone changes school. */
  --accent:#ffc94d; --accent-glow:rgba(255,201,77,.45); --accent-dim:rgba(255,201,77,.22);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:#0d0a1f;color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;
  overscroll-behavior:none;text-size-adjust:100%;-webkit-text-size-adjust:100%;}
/* safe-area insets, so nothing hides under a notch or the home indicator */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);}
#bg{position:fixed;inset:0;background:center/cover url(./assets/title_bg.jpg);filter:brightness(.45) saturate(1.1);z-index:0;}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:1200px;margin:0 auto;
  padding-left:var(--sal);padding-right:var(--sar);}
/* dvh tracks the collapsing mobile browser chrome; % does not */
@supports (height:100dvh){ #app{height:100dvh;} }

/* top bar */
#topbar{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat)) 14px 10px;
  background:linear-gradient(180deg,rgba(20,14,40,.95),rgba(20,14,40,.7));
  border-bottom:1px solid var(--accent);box-shadow:0 2px 16px -4px var(--accent-glow);
  z-index:5;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
#topbar::-webkit-scrollbar{display:none;}
#topbar .logo{font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--gold);
  text-shadow:0 0 12px rgba(255,201,77,.5);letter-spacing:1px;margin-right:auto;}
.stat{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:14px;white-space:nowrap;flex:0 0 auto;}
.stat b{color:var(--gold);font-weight:700;}
/* a stat pill that is also a control still needs a real tap target */
.statbtn{cursor:pointer;font-family:inherit;color:var(--ink);min-height:34px;min-width:44px;
  justify-content:center;font-size:17px;line-height:1;touch-action:manipulation;}

/* nav */
#nav{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:rgba(20,14,40,.9);border-bottom:1px solid var(--line);
  z-index:5;flex-shrink:0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#nav::-webkit-scrollbar{display:none;}
.navbtn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 12px;border-radius:10px;
  border:1px solid transparent;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;min-width:64px;min-height:48px;}
.navbtn .ic{font-size:20px;}
@media (hover:hover){ .navbtn:hover{background:var(--panel2);color:var(--ink);} }
.navbtn.on{background:var(--panel2);color:var(--accent);border-color:var(--accent);box-shadow:0 0 12px -3px var(--accent-glow);}

/* screens */
/* The duel arena is a BAND, not a half-screen. It used to be flex:1 alongside #screen, so the
   two split the viewport and the player's hand was pushed below the fold behind it. Bounded
   height keeps the cards reachable, which matters more than a big 3D view. */
#battleWrap{position:relative;flex:0 0 clamp(190px, 30vh, 330px);overflow:hidden;background:#0d0820;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
#battle3d{position:absolute;inset:0;width:100%;height:100%;display:block;}
#screen{padding:14px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;padding-bottom:calc(40px + var(--sab));-webkit-overflow-scrolling:touch;}
.screen{display:none;animation:fade .25s ease;}
.screen.on{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;}}
h2{font-family:Georgia,serif;color:var(--gold);margin:2px 0 12px;font-size:22px;letter-spacing:.5px;}
h3{font-family:Georgia,serif;color:var(--ink);margin:14px 0 8px;font-size:17px;}
.sub{color:var(--muted);font-size:13px;margin:-6px 0 12px;}
/* A flat fill + 1px border read as a wireframe, not a designed surface. A gentle top-lit gradient
   plus a real drop shadow is the cheapest possible "this has depth" cue, and costs nothing —
   still pure CSS, no new assets. The inset highlight fakes a soft top edge, like light catching
   a beveled panel. */
.panel{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:14px;padding:14px;margin-bottom:14px;
  box-shadow:0 6px 18px -4px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);}
.row{display:flex;gap:10px;flex-wrap:wrap;}

/* buttons */
.btn{background:linear-gradient(180deg,#3a2d6e,#241c44);color:var(--ink);border:1px solid var(--line);border-radius:10px;
  padding:10px 16px;font-size:14px;cursor:pointer;font-weight:600;min-height:44px;touch-action:manipulation;
  box-shadow:0 3px 8px -2px rgba(0,0,0,.5);transition:transform .08s ease,box-shadow .08s ease;}
@media (hover:hover){ .btn:hover{filter:brightness(1.15);} }
.btn:active{transform:translateY(1px);box-shadow:0 1px 4px -1px rgba(0,0,0,.5);}
.btn.gold{background:linear-gradient(180deg,#e8a33d,#b97a1e);color:#24170a;border-color:#ffd98a;}
.btn.ok{background:linear-gradient(180deg,#2f9e63,#1f6b42);border-color:#6ee7a0;}
.btn.danger{background:linear-gradient(180deg,#b33,#6e1f1f);border-color:#ff6b6b;}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.4);box-shadow:none;}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px;min-height:34px;}

/* cards */
/* fluid so a 320px phone and a 1200px desktop both get a sensible card */
.card{width:clamp(84px,23vw,108px);border-radius:10px;overflow:hidden;position:relative;border:2px solid #fff;cursor:pointer;
  background:#0c0a1c;box-shadow:0 4px 12px rgba(0,0,0,.5);transition:transform .1s;flex:0 0 auto;}
.card.wide{width:clamp(112px,30vw,150px);}
@media (hover:hover){ .card:hover{transform:translateY(-4px);} }
/* aspect-ratio keeps the art proportional as the card width flexes */
.card .art{aspect-ratio:1.46;height:auto;background:center/cover;position:relative;}
.card.wide .art{aspect-ratio:1.44;height:auto;}
.card .cost{position:absolute;top:4px;left:4px;background:radial-gradient(circle,#6a8cff,#2c3f8a);color:#fff;font-weight:800;
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;border:1px solid #9db4ff;}
.card .atk,.card .hp{position:absolute;bottom:4px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#fff;border:1px solid #fff;}
.card .atk{left:4px;background:#c0392b;}
.card .hp{right:4px;background:#2e9e5b;}
.card .body{padding:5px 6px;}
.card .nm{font-size:12px;font-weight:700;line-height:1.1;min-height:26px;}
.card .tx{font-size:10px;color:var(--muted);line-height:1.2;margin-top:2px;min-height:26px;}
.card .grade{position:absolute;top:4px;right:4px;font-size:14px;background:rgba(0,0,0,.5);border-radius:8px;padding:1px 5px;}
.card .serial{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--gold);background:rgba(0,0,0,.6);border-radius:6px;padding:1px 6px;letter-spacing:1px;font-weight:700;white-space:nowrap;}
/* Printings (variants.js). The badge row sits top-LEFT because the grade already owns top-right
   and the two must be readable at once — a Gem Mint holo is the whole point of the system. */
.card .printing{position:absolute;top:4px;left:4px;font-size:12px;background:rgba(0,0,0,.55);border-radius:8px;padding:1px 5px;letter-spacing:1px;}
/* A diagonal sheen across the art, so a foil reads as a foil in a grid without any text. */
.card .sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;}
.card.slab{border-image:linear-gradient(135deg,#e8c36a,#fff,#7be0ff,#e8c36a) 1;box-shadow:0 0 14px rgba(255,201,77,.55),0 4px 12px rgba(0,0,0,.5);}
.card.slab .art{outline:1px solid rgba(255,215,120,.6);}
.card .val{position:absolute;bottom:4px;right:4px;font-size:10px;color:var(--gold);background:rgba(0,0,0,.55);padding:1px 5px;border-radius:6px;}
.card .slot{position:absolute;top:4px;right:4px;font-size:13px;background:rgba(0,0,0,.5);border-radius:8px;padding:1px 5px;}
.card.sel{outline:3px solid var(--gold);transform:translateY(-6px);}
.card.disabled{opacity:.45;cursor:not-allowed;}
.card.tired{opacity:.6;}
.card .tired-ic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;opacity:.9;text-shadow:0 0 6px #000;}

/* booster pack opening (BACKLOG §5 "Booster opening animations") — rendered into the app's
   existing generic #overlay/showOverlay() modal rather than a bespoke one. */
.packgrid{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:6px 0 16px;}
/* Sized to match .card's own clamp so the face-down back and the revealed .card front line up. */
.packcard{width:clamp(84px,23vw,108px);perspective:900px;cursor:pointer;}
.packcard .flip{position:relative;width:100%;aspect-ratio:0.68;transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.2,.8,.2,1);}
.packcard.flipped .flip{transform:rotateY(180deg);}
.packcard .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;overflow:hidden;}
.packcard .back{background:linear-gradient(160deg,#3a2d6e,#1a1440);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:34px;}
.packcard .front{transform:rotateY(180deg);}
.packcard .front .card{width:100%;cursor:inherit;}
/* A rare printing or a high base rarity pulses its own border colour once revealed — the flip
   itself already sells "something happened"; the glow is what says "something GOOD happened". */
.packcard.rare-glow.flipped .flip{animation:packglow 1.3s ease-in-out infinite alternate;}
@keyframes packglow{from{filter:drop-shadow(0 0 3px var(--glowcolor));}to{filter:drop-shadow(0 0 16px var(--glowcolor));}}

/* list rows */
.lrow{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel2);flex-wrap:wrap;}
.lrow .grow{flex:1;min-width:120px;}
.lrow .t{font-weight:700;font-size:14px;}
.lrow .d{font-size:12px;color:var(--muted);}
.ic{font-size:20px;}

/* duel */
#duelWrap{display:flex;flex-direction:column;gap:10px;height:100%;}
.duelzone{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);min-height:120px;background:var(--panel);}
.duelzone.bg{background:center/cover url(./assets/duel_bg.jpg);min-height:150px;}
.zonecap{position:absolute;top:6px;left:10px;font-size:12px;color:var(--muted);z-index:2;}
.wizbar{position:absolute;top:6px;right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;z-index:2;}
.wizbar .bar{width:clamp(90px,32vw,150px);height:12px;background:#00000066;border:1px solid #fff3;border-radius:6px;overflow:hidden;}
.wizbar .bar>div{height:100%;background:linear-gradient(90deg,#ff6b6b,#ff9a5a);}
.wizbar .bar.o>div{background:linear-gradient(90deg,#54a0ff,#7aa8ff);}
.board{display:flex;gap:8px;padding:40px 10px 10px;flex-wrap:wrap;justify-content:center;min-height:120px;}
.hand{display:flex;gap:8px;padding:8px;overflow-x:auto;justify-content:center;flex-wrap:wrap;scrollbar-width:none;}
.hand::-webkit-scrollbar{display:none;}
.pipbar{display:flex;gap:4px;align-items:center;padding:6px 10px;}
.pip{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#6a8cff,#2c3f8a);border:1px solid #9db4ff;}
.pip.full{background:radial-gradient(circle,#ffd94a,#c8860a);border-color:#fff0a0;}
#duelLog{font-size:12px;color:var(--muted);min-height:20px;padding:6px 10px;background:var(--panel);border-radius:10px;border:1px solid var(--line);}
#duelStatus{font-size:14px;font-weight:700;color:var(--gold);text-align:center;padding:4px;}

/* progress */
.pbar{height:10px;background:#00000055;border-radius:6px;overflow:hidden;border:1px solid #fff3;}
.pbar>div{height:100%;background:linear-gradient(90deg,#e8a33d,#ffd94a);transition:width .1s;}

/* skill grid */
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;}
.kpi .lv{font-size:26px;font-weight:800;color:var(--gold);}
.kpi .nm{font-size:13px;color:var(--muted);margin-top:2px;}

/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#24170a;color:var(--gold);
  border:1px solid var(--gold);padding:10px 18px;border-radius:10px;font-weight:700;z-index:99;display:none;box-shadow:0 6px 20px #000;}
#err{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3a0f0f;color:#ffb3b3;border:1px solid #ff6b6b;padding:10px 18px;border-radius:10px;font-weight:700;z-index:99;display:none;}

/* ---------------- 3D world HUD ---------------- */
#world{position:absolute;inset:0;width:100%;height:100%;display:block;
  /* the canvas handles its own gestures: never let the browser pan/zoom the page on it */
  touch-action:none;}
#worldHud{position:absolute;top:calc(10px + var(--sat));left:50%;transform:translateX(-50%);
  background:rgba(20,14,40,.8);border:1px solid var(--line);border-radius:12px;padding:6px 14px;
  font-size:13px;font-weight:700;color:var(--gold);display:none;pointer-events:none;z-index:3;
  max-width:min(92%,520px);text-align:center;}
#joy{position:absolute;left:calc(20px + var(--sal));bottom:calc(24px + var(--sab));
  width:min(124px,30vw);height:min(124px,30vw);z-index:4;display:none;touch-action:none;
  border-radius:50%;border:1px solid rgba(255,201,77,.28);background:rgba(20,14,40,.30);
  box-shadow:inset 0 0 24px rgba(0,0,0,.35);transition:background .12s,border-color .12s;}
#joy.active{background:rgba(20,14,40,.5);border-color:rgba(255,201,77,.55);}
#joyKnob{position:absolute;left:50%;top:50%;width:42%;height:42%;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#ffe6a8,#e8a33d 60%,#b97a1e);
  border:1px solid rgba(255,255,255,.55);box-shadow:0 3px 10px rgba(0,0,0,.5);}
#prompt{position:absolute;left:50%;bottom:calc(26px + var(--sab));transform:translateX(-50%);
  z-index:4;display:none;max-width:calc(100% - 32px);}
#prompt .btn{white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.5);}
.worldbtn{position:absolute;right:calc(16px + var(--sar));width:44px;height:44px;border-radius:50%;
  z-index:4;display:none;align-items:center;justify-content:center;font-size:22px;font-weight:800;
  background:rgba(20,14,40,.72);color:var(--gold);border:1px solid var(--line);cursor:pointer;
  touch-action:manipulation;line-height:1;padding:0;}
#zoomIn{bottom:calc(94px + var(--sab));}
#zoomOut{bottom:calc(42px + var(--sab));}
/* the zoom buttons are a desktop/one-handed affordance; pinch covers multi-touch */
body.has-touch .worldbtn{display:flex;}
/* the map/fast-travel button is useful on every input method, unlike zoom, so it is not gated
   behind .has-touch the way #zoomIn/#zoomOut are. */
#mapBtn{position:absolute;left:calc(16px + var(--sal));bottom:calc(26px + var(--sab));width:44px;
  height:44px;border-radius:50%;z-index:4;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:rgba(20,14,40,.72);color:var(--accent);border:1px solid var(--line);
  cursor:pointer;touch-action:manipulation;line-height:1;padding:0;}

/* ---------------- responsive ----------------
   Card sizes are fluid (clamp) above, so these breakpoints only handle chrome density and
   the vertical budget — which is what actually breaks on a phone, especially in landscape. */

/* modals: keep them inside the safe area and off the screen edges on small phones */
#objective{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:0 8px 6px;
  background:linear-gradient(90deg,rgba(122,92,255,.22),rgba(122,92,255,.06));
  border:1px solid rgba(160,130,255,.45);border-radius:12px;font-size:13px;}
#objective .obj-tick{font-size:15px;flex:0 0 auto}
#objective .obj-main{flex:1;min-width:0}
#objective .obj-title{font-weight:700;color:var(--gold)}
#objective .obj-why{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#objective button{flex:0 0 auto;font-size:12px;padding:6px 10px;min-height:34px}
@media (max-width:520px){ #objective .obj-why{display:none} }
#schoolPicker>div,#overlay>div{margin-top:max(4vh,var(--sat));margin-bottom:calc(16px + var(--sab));}
@media (max-width:640px){
  #schoolPicker>div{padding:20px 14px;width:auto;margin-left:10px;margin-right:10px;border-radius:18px;}
  #schoolPicker>div>div:first-child{font-size:21px;}
  #overlay>div{margin-left:10px;margin-right:10px;padding:16px 14px;}
  #dialogue>div{padding:18px 16px;}
}

/* phones */
@media (max-width:640px){
  #topbar{gap:6px;padding-left:10px;padding-right:10px;}
  #topbar .logo{font-size:16px;}
  .stat{font-size:13px;padding:4px 10px;}
  .navbtn{min-width:56px;font-size:11px;padding:6px 9px;}
  .navbtn .ic{font-size:18px;}
  #screen{padding:12px 10px calc(36px + var(--sab));}
  .panel{padding:12px;border-radius:12px;}
  h2{font-size:20px;}
  .board{padding:36px 6px 8px;gap:6px;min-height:104px;}
  .duelzone{min-height:104px;}
  .duelzone.bg{min-height:128px;}
  .skillgrid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));}
}

/* small phones (iPhone SE / 320-380px) — the logo is the first thing to go */
@media (max-width:380px){
  #topbar .logo{font-size:0;margin-right:auto;}
  #topbar .logo::before{content:"✦";font-size:20px;}
  .stat{font-size:12px;padding:3px 8px;gap:4px;}
  .navbtn{min-width:50px;font-size:10px;padding:5px 7px;}
  #screen{padding:10px 8px calc(32px + var(--sab));}
  .row{gap:8px;}
  .btn{padding:9px 12px;font-size:13px;}
  .zonecap{font-size:11px;}
}

/* landscape phones: height is the scarce resource, so collapse the chrome hard */
@media (max-height:520px) and (orientation:landscape){
  #topbar{padding-top:calc(4px + var(--sat));padding-bottom:4px;}
  #topbar .logo{font-size:15px;}
  .stat{padding:2px 9px;font-size:12px;}
  #nav{padding:4px 8px;}
  .navbtn{flex-direction:row;gap:6px;min-height:36px;min-width:auto;padding:4px 10px;font-size:11px;}
  .navbtn .ic{font-size:15px;}
  #screen{padding:8px 10px calc(16px + var(--sab));}
  h2{font-size:17px;margin-bottom:8px;}
  h3{font-size:15px;margin:8px 0 6px;}
  .panel{padding:10px;margin-bottom:10px;}
  .board{padding:28px 6px 6px;min-height:88px;}
  .duelzone,.duelzone.bg{min-height:88px;}
  .card{width:clamp(72px,13vw,96px);}
  /* the joystick sits higher so it clears the home indicator in landscape */
  #joy{bottom:calc(12px + var(--sab)) !important;}
}

/* tablets and up: roomier cards, two-up panels where it helps */
@media (min-width:900px){
  .card{width:116px;}
  .card.wide{width:158px;}
  .skillgrid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));}
}

/* respect reduced-motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <div id="topbar">
    <div class="logo">✦ Arcane Legends</div>
    <div class="stat">🪙 <b id="sGold">0</b></div>
    <div class="stat">⭐ <b id="sLvl">1</b></div>
    <div class="stat">🧙 <b id="sXp">0</b></div>
    <button id="muteBtn" class="stat statbtn" aria-label="Toggle sound" onclick="window.__ev('toggleMute')">🔊</button>
  </div>
  <div id="nav"></div>
  <!-- Onboarding objective bar. Present on every screen including the 3D world, because the
       chain sends the player back and forth between them and an objective you can only see on
       one screen is an objective you lose track of. -->
  <div id="objective" style="display:none"></div>

// School accent: the top bar and the active nav tab wear the player's own school colour
// (SCHOOLS[x].color), so the chrome reads as THIS wizard's academy rather than an identical
// shell for every save. Deliberately confined to those two spots — a full reskin per school
// would fight the game's own palette instead of accenting it. Called once at boot and again
// anywhere G.setSchool runs (chooseSchool, ccSchool).
function applyAccent(){
  const school = SCHOOLS[S.school] || SCHOOLS.balance;
  const hex = school.color;
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const root = document.documentElement.style;
  root.setProperty("--accent", hex);
  root.setProperty("--accent-glow", `rgba(${r},${g},${b},.45)`);
  root.setProperty("--accent-dim", `rgba(${r},${g},${b},.22)`);
}
applyAccent();

    ? `<button class="btn sm ok" onclick="window.__ev('lsnSubmit|${l.id}')">Submit</button>`
    : `<span class="sub">${p.have}/${p.need}</span>`;

function buildScribing(){

    const have = S.inventory[cm.id]||0;
    h += `<div class="panel" style="flex:1;min-width:170px"><div style="font-weight:700">${cm.icon} ${cm.name} <span style="color:var(--gold)">×${have}</span></div><div class="sub">Refine from: ${sources}</div><div class="row" style="gap:4px">`;

  const canScribe = (S.inventory.canvas||0)>0 && (S.inventory.ink||0)>0 && (S.inventory.reagent||0)>0;

  return h;
}
function buildForge(){

  h += `<h3>⚒️ Smelt bars</h3><div class="row">`;

  h += `</div><h3>⚒️ Forge equipment</h3><div class="row">`;

    h += `<div class="panel" style="flex:1;min-width:150px"><div style="font-weight:700">${e.icon} ${e.name}</div><div class="sub">Smelting ${e.lvl} · ${e.bars}× ${e.name.split(" ")[0]} bar</div><div class="sub" style="color:var(--gold)">${equipStatsLabel(e)}</div><button class="btn sm ${ok?"ok":""}" ${ok?"":"disabled"} onclick="window.__ev('forge|${e.id}')">Forge</button></div>`;
  }
  h += `</div><h3>⚗️ Brew potions</h3><div class="row">`;
  for (const p of POTIONS){ const ok = G.skillLevel(S,"alchemy") >= p.lvl && G.hasItems(S,p.req); const req = Object.entries(p.req).map(([id,n])=>`${fname(id)}×${n}`).join(" + "); h += `<div class="panel" style="flex:1;min-width:150px"><div style="font-weight:700">${p.icon} ${p.name}</div><div class="sub">Alchemy ${p.lvl} · heals ${p.heal}</div><div class="sub">${req}</div><button class="btn sm ${ok?"ok":""}" ${ok?"":"disabled"} onclick="window.__ev('brew|${p.id}')">Brew</button></div>`; }
  h += `</div>`;
  return h;
}

// ================= card renderer =================
function cardFace(c, opts={}){
  const school = SCHOOLS[c.school];
  const rarity = RARITY[c.rarity];
  const grade = (opts.grade) ? gradeForRoll(opts.grade) : null;
  const val = (opts.value!=null) ? opts.value : cardValue(c.id, opts.grade!=null?opts.grade:100);
  const cls = ["card"];
  if (opts.wide) cls.push("wide");
  if (opts.sel) cls.push("sel");
  if (opts.disabled) cls.push("disabled");
  if (opts.tired) cls.push("tired");
  if (opts.slab) cls.push("slab");
  const art = school.art;
  let flag = "";
  if (opts.tired) flag = `<div class="tired-ic">😴</div>`;
  let attrs = "";
  if (opts.onclick) attrs = ` onclick="window.__ev('${opts.onclick}')"`;
  // Printings (variants.js). `opts.inst` is the card INSTANCE, so the face can show what this
  // particular copy is — a foil border sheen and the badges. Passing nothing keeps the plain
  // catalog face, which is what the deckbuilder and the duel want.
  const badges = opts.inst ? VAR.badgesFor(opts.inst) : [];
  const printing = opts.inst ? VAR.variantOf(opts.inst) : null;
  // The border is the printing's colour when it has one: a rare printing has to be visible in a
  // grid of ninety cards without reading every badge.
  const border = printing && printing.color != null ? "#" + printing.color.toString(16).padStart(6,"0") : rarity.color;
  const sheen = printing && printing.glow
    ? `<div class="sheen" style="opacity:${(0.18 + printing.glow * 0.3).toFixed(2)};background:linear-gradient(115deg,transparent 30%,${border} 50%,transparent 70%)"></div>` : "";
  return `<div class="${cls.join(" ")}" style="border-color:${border}${printing&&printing.glow?`;box-shadow:0 0 ${Math.round(6+printing.glow*10)}px ${border}66`:""}" ${attrs}>
    <div class="art" style="background-image:url(./assets/${art})">
      ${sheen}
      <div class="cost">${c.cost}</div>
      ${c.type==="creature" ? `<div class="atk">${c.atk}</div><div class="hp">${c.hp}</div>` : ""}
      ${grade ? `<div class="grade" title="${grade.name}">${grade.icon}</div>` : ""}
      ${badges.length ? `<div class="printing" title="${VAR.labelFor(opts.inst)}">${badges.map(b=>b.badge).join("")}</div>` : ""}
      ${opts.slab ? `<div class="serial">#${opts.serial}</div>` : ""}
      ${opts.value!=null ? `<div class="val">🪙${val}</div>` : ""}
      ${flag}
    </div>
    <div class="body">
      <div class="nm">${c.name}</div>
      <div class="tx">${c.text||""}</div>
    </div>
  </div>`;
}
// global event router for inline onclick
window.__ev = function(fn){ const [name, ...args] = fn.split("|"); const f = window.__EV[name]; if (f) f(...args); };
window.__EV = {};
window.__EV.dlgBtn = (i)=>{ const b = dlgButtons && dlgButtons[i]; if(!b) return; closeDialogue(); if(b.action) b.action(); };
window.__EV.dlgClose = ()=>{ closeDialogue(); };
window.__EV.ovClose = ()=>{ $("overlay").style.display = "none"; };
window.__EV.spPick = (i,j)=>{
  i = +i; j = +j;
  spAnswers.push(SCHOOL_Q[i].opts[j][1]);
  if (i < SCHOOL_Q.length-1) renderSPQuestion(i+1);
  else { const tally={}; for(const s of spAnswers) tally[s]=(tally[s]||0)+1; const sug=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0][0]; renderSPSuggest(sug); }
};
window.__EV.spAll = ()=>renderSPAll();
window.__EV.chooseSchool = (s)=>{
  G.setSchool(S, s); S.flags.schoolPicked = true;
  G.issueSchoolStarter(S, s);
  applyAccent();
  save();
  $("schoolPicker").style.display = "none";
  if (world){ world.setPlayerAppearance(CC.appearanceFor(S)); world.setPlayerGear(EQ3.attachmentsFor(S)); }
  toast(`Welcome to the ${SCHOOLS[s].name} School! Your school's cards were added to your collection.`); render();
  // The school picker is now step 2 of character creation. If creation is still unfinished
  // (no name yet, or no look chosen), fall back into it rather than dumping the player into the
  // world half-created — the whole point of the flow is that it completes.
  if (ccOpen && !CC.isComplete(S)) showCharCreate();
};

// ================= character creation (BACKLOG §2) =================
// Three steps, each DERIVED from the save by charcreate.js — there is no step cursor to desync.
// The live 3D preview applies the SAME appearance object world.js does, so what is shown here is
// literally what gets rendered in the world.
let preview = null, ccOpen = false, ccDraftName = "";
function showCharCreate(){
  ccOpen = true;
  $("charCreate").style.display = "block";
  ccDraftName = S.name || "";
  if (!preview){
    try { preview = createPreview($("ccPreview")); } catch(e){ console.warn("preview unavailable:", e && e.message); }
  }
  if (preview){ preview.resize(); preview.setAppearance(CC.appearanceFor(S)); preview.setGear(EQ3.attachmentsFor(S)); preview.start(); }
  renderCharCreate();
}
function closeCharCreate(){
  ccOpen = false;
  $("charCreate").style.display = "none";
  if (preview) preview.stop();          // stop the loop; keep the context so reopening is instant
  if (world){ world.setPlayerAppearance(CC.appearanceFor(S)); world.setPlayerGear(EQ3.attachmentsFor(S)); }
  render();
}
function renderCharCreate(){
  if (!ccOpen) return;
  const step = CC.currentStep(S) || CC.STEPS[CC.STEPS.length - 1];
  const prog = CC.progress(S);
  const look = CC.appearanceFor(S);
  if (preview){ preview.setAppearance(look); preview.setGear(EQ3.attachmentsFor(S)); }
  $("ccSub").textContent = `${step.sub}  ·  step ${prog.index + 1} of ${prog.total}`;
  $("ccLook").textContent = look.label;

  let h = "";
  // --- name ---
  h += `<div class="panel" style="margin-bottom:10px"><div style="font-weight:700">1 · Your name</div>
    <input id="ccName" type="text" maxlength="${CC.NAME_MAX}" value="${escapeAttr(ccDraftName)}"
      placeholder="${CC.DEFAULT_NAME}" oninput="window.__ev('ccName')"
      style="width:100%;margin-top:6px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#12101c;color:var(--ink);font-size:15px">
    <div class="sub" id="ccNameErr" style="margin-top:4px;min-height:16px"></div></div>`;
  // --- school ---
  const sc = SCHOOLS[S.school];
  h += `<div class="panel" style="margin-bottom:10px"><div style="font-weight:700">2 · Your school</div>
    <div class="sub" style="margin:4px 0">${SCHOOL_ICON[S.school]} <b style="color:${sc.color}">${sc.name}</b> — ${SCHOOL_DESC[S.school].split(".")[0]}.</div>
    <div class="row" style="flex-wrap:wrap;gap:5px">` +
    Object.keys(SCHOOLS).map(id=>`<button class="btn sm ${id===S.school?"gold":""}"
      onclick="window.__ev('ccSchool|${id}')">${SCHOOL_ICON[id]} ${SCHOOLS[id].name}</button>`).join("") +
    `</div><div class="sub" style="margin-top:6px">Changing school swaps your starter deck and your colours. Not sure? <a href="#" onclick="window.__ev('ccQuiz');return false;" style="color:var(--gold)">take the quiz</a>.</div></div>`;
  // --- look ---
  h += `<div class="panel"><div style="font-weight:700">3 · Your look</div>
    <div class="sub" style="margin:6px 0 4px">Robe dye</div><div class="row" style="flex-wrap:wrap;gap:5px">` +
    CC.VARIANTS.map(v=>`<button class="btn sm ${v.id===CC.variantFor(S).id?"gold":""}"
      onclick="window.__ev('ccVariant|${v.id}')">${v.label}</button>`).join("") +
    `</div><div class="sub" style="margin:10px 0 4px">Arcane aura</div><div class="row" style="flex-wrap:wrap;gap:5px">` +
    CC.AURAS.map(a=>`<button class="btn sm ${a.id===CC.auraFor(S).id?"gold":""}"
      onclick="window.__ev('ccAura|${a.id}')">${a.label}</button>`).join("") +
    `</div></div>`;
  $("ccBody").innerHTML = h;

  const problem = CC.nameProblem(ccDraftName);
  $("ccNameErr").textContent = ccDraftName ? (problem || "") : "";
  $("ccNameErr").style.color = problem ? "var(--danger)" : "var(--muted)";
  const ready = !problem;
  $("ccNav").innerHTML = `<button class="btn" onclick="window.__ev('ccSpin')">🔄 Spin</button>
    <button class="btn gold" ${ready?"":"disabled"} onclick="window.__ev('ccDone')">${ready?"Enter the Academy":"Choose a name first"}</button>`;
}
function esc(v){ return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escapeAttr(v){ return String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
window.__EV.ccName = ()=>{
  // Re-render the whole panel on every keystroke would blow away focus, so only the error line
  // and the confirm button update here.
  ccDraftName = $("ccName").value;
  const problem = CC.nameProblem(ccDraftName);
  $("ccNameErr").textContent = ccDraftName ? (problem || "") : "";
  $("ccNameErr").style.color = problem ? "var(--danger)" : "var(--muted)";
  const btn = $("ccNav").querySelector(".btn.gold");
  if (btn){ btn.disabled = !!problem; btn.textContent = problem ? "Choose a name first" : "Enter the Academy"; }
};
window.__EV.ccSchool = (id)=>{
  if (!SCHOOLS[id]) return;
  G.setSchool(S, id); S.flags.schoolPicked = true;
  G.issueSchoolStarter(S, id);
  applyAccent();
  save(); renderCharCreate();
};
window.__EV.ccVariant = (id)=>{ CC.applyAppearance(S, { variant:id }); save(); renderCharCreate(); };
window.__EV.ccAura = (id)=>{ CC.applyAppearance(S, { aura:id }); save(); renderCharCreate(); };
window.__EV.ccSpin = ()=>{ if (preview) preview.nudge(90); };
window.__EV.ccQuiz = ()=>{ $("charCreate").style.display = "none"; showSchoolPicker(); };
window.__EV.ccDone = ()=>{
  const r = CC.applyAppearance(S, { name: ccDraftName });
  if (!r.ok){ err(r.err); return; }
  CC.applyAppearance(S, { variant: CC.variantFor(S).id, aura: CC.auraFor(S).id });  // pin the defaults
  save();
  closeCharCreate();
  toast(`Welcome, ${S.name}.`);
};
window.__EV.openCharCreate = ()=>{ showCharCreate(); };

// ================= navigation =================
const NAV = [
  ["world","🌍","World"],["home","🏰",STR.nav_home],["skills","⛏️",STR.nav_skills],["collection","🃏",STR.nav_collection],
  ["loadout","🗡️",STR.nav_loadout],["market","🛒",STR.nav_market],["quests","📜",STR.nav_quests],["pvp","⚔️",STR.nav_pvp],
];
// Onboarding objective bar. Rebuilt on every render because every step is DERIVED from the save
// (see onboarding.js) — there is no state here to keep in sync, it just re-asks the questions.
function buildObjective(){
  const bar = $("objective");
  const step = ONBOARD.currentStep(S);
  if (!step || S.flags.onboardingHidden){ bar.style.display = "none"; return; }
  const p = ONBOARD.progress(S);
  const where = step.where ? ` — ${step.where}` : "";
  const canGo = step.goto && step.goto !== screen && step.goto !== "duel";
  bar.innerHTML =
    `<span class="obj-tick">🎓</span>` +
    `<span class="obj-main"><div class="obj-title">${p.index}/${p.total} · ${step.title}</div>` +
    `<div class="obj-why">${step.why}${where}</div></span>` +
    (canGo ? `<button class="btn gold" onclick="window.__ev('objGo')">Go</button>` : ``) +
    `<button class="btn" onclick="window.__ev('objHide')" aria-label="Hide guide">✕</button>`;
  bar.style.display = "flex";
}
window.__EV.objGo = ()=>{
  const step = ONBOARD.currentStep(S);
  if (!step) return;
  screen = step.goto === "world" ? "world" : step.goto;
  render();
};
window.__EV.objHide = ()=>{ S.flags.onboardingHidden = true; save(); render(); };

function buildNav(){
  $("nav").innerHTML = NAV.map(([id,ic,label])=>`<button class="navbtn ${id===screen?"on":""}" data-screen="${id}"><span class="ic">${ic}</span>${label}</button>`).join("");
  document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{ screen=b.dataset.screen; render(); });
}
function render(){
  AUDIO.setContext(screen === "world" ? "world" : (screen === "duel" || screen === "online") ? "duel" : "menu");
  buildNav();
  buildObjective();
  const scr = $("screen");
  const worldWrap = $("worldWrap");
  const battleWrap = $("battleWrap");
  if (screen==="world"){
    scr.style.display = "none";
    worldWrap.style.display = "block";
    battleWrap.style.display = "none";
    if (battle3d) battle3d.stop();
    if (world) world.resize();
    refreshTop();
    return;
  }
  scr.style.display = "block";
  worldWrap.style.display = "none";
  if (screen==="duel"){
    battleWrap.style.display = "block";
    syncBattle3d();
  } else {
    battleWrap.style.display = "none";
    if (battle3d) battle3d.stop();
  }
  scr.innerHTML = `<div class="screen on" id="scr_${screen}"></div>`;
  const el = $(`scr_${screen}`);
  if (screen==="home") renderHome(el);
  if (screen==="skills") renderSkills(el);
  if (screen==="collection") renderCollection(el);
  if (screen==="loadout") renderLoadout(el);
  if (screen==="market") renderMarket(el);
  if (screen==="quests") renderQuests(el);
  if (screen==="pvp") renderPvp(el);
  if (screen==="duel") renderDuel(el);
  if (screen==="online") renderOnline(el);
  save();
}

// ================= HOME =================
// The curriculum panel: current year, its perks, and progress toward the next one. Pulled out of
// renderHome() so the Hall stays readable — it is already the busiest screen in the game.
function renderCurriculum(){
  const score = G.academyScore(S);
  const year = ACADEMY.yearFor(score);
  const prog = ACADEMY.progressToNext(score);
  const perkRow = (label, pct) => pct > 0
    ? `<div class="kpi"><div class="lv" style="font-size:16px">+${pct}%</div><div class="nm">${label}</div></div>` : "";
  // Classes are the content half of the curriculum; the perks below are the passive half. Both
  // live on this panel so the player is never told about one without the other.
  const yi = ACADEMY.yearIndexFor(score);
  const yp = LSN.yearProgress(S, yi);
  const ready = LSN.submittable(S).length, doing = LSN.active(S).length, open = LSN.available(S, yi).length;
  const classLine = `<div class="row" style="align-items:center;margin-top:8px">
    <div class="grow sub">Classes this year: <b>${yp.done}/${yp.total}</b>${
      ready ? ` · <span style="color:var(--ok)">${ready} ready to submit</span>` : doing ? ` · ${doing} in progress` : open ? ` · ${open} open to enrol` : ""}</div>
    <button class="btn sm ${ready?"ok":""}" onclick="window.__ev('openClasses')">🎓 Classes</button></div>`;
  return `<div class="panel" style="margin-top:12px"><h3>📖 Curriculum — ${year.name}, ${year.subtitle}</h3>
    <div class="row">${perkRow("Quest Gold", year.perks.questGold)}${perkRow("Market Discount", year.perks.market)}${perkRow("XP Gain", year.perks.xp)}</div>
    ${prog.maxed
      ? `<p class="sub" style="margin-top:8px">You have completed the curriculum. There is nothing left to teach you here.</p>`
      : `<p class="sub" style="margin-top:8px">${prog.have}/${prog.need} toward ${prog.next.name}</p>
         <div class="pbar"><div style="width:${prog.pct}%"></div></div>`}
    ${classLine}
  </div>`;
}
window.__EV.openClasses = ()=>{ showOverlay("The Arcanum Curriculum", buildClasses()); };
window.__EV.lsnEnroll = (id)=>{
  const r = LSN.enroll(S, id);
  if (r.ok) toast(`📚 Enrolled: ${r.lesson.title}`);
  save(); refreshClasses();
};
window.__EV.lsnSubmit = (id)=>{
  const r = LSN.submit(S, id);
  if (!r.ok){ err(r.err === "unfinished" ? "That assignment is not finished" : "Not enrolled"); return; }
  // lessons.js stays pure and hands the reward back; applying it is the engine's job — the same
  // split zonequests.js uses.
  const gold = ACADEMY.applyBonus(r.reward.gold, G.academyPerks(S).questGold);
  S.gold += gold; G.addWizardXp(S, ACADEMY.applyBonus(r.reward.xp, G.academyPerks(S).xp));
  const drops = r.reward.cards ? G.dropCards(S, r.reward.cards) : [];
  toast(`🎓 Passed ${r.lesson.title}! +${gold}g${drops.length?` +${drops.length} cards`:""}`);
  winSfx();
  save(); refreshClasses();
};
// The syllabus can be open as an overlay (from the Dean) or as a Hall panel. Refresh whichever
// is actually on screen rather than assuming.
function refreshClasses(){
  if ($("overlay").style.display === "block") showOverlay("The Arcanum Curriculum", buildClasses());
  render();
}

// Reputation with the NPCs the player has actually quested for. Empty until the first field
// quest is accepted, rather than listing every giver in the game with zero standing.
function renderReputationPanel(){
  const known = Object.keys(S.reputation || {});
  if (!known.length) return "";
  let h = `<div class="panel" style="margin-top:12px"><h3>🤝 Reputation</h3>`;
  for (const key of known){
    const name = (QUEST_GIVERS[key] && QUEST_GIVERS[key].name) || key;
    const rep = REP.repOf(S, key), lvl = REP.levelFor(rep), prog = REP.progressToNext(rep);
    h += `<div class="row" style="align-items:center;margin-bottom:6px">
      <div class="grow"><b>${name}</b> <span class="sub">${lvl.name}${lvl.bonus ? ` (+${lvl.bonus}%)` : ""}</span>
        ${prog.maxed ? "" : `<div class="pbar" style="margin-top:4px"><div style="width:${prog.pct}%"></div></div>`}
      </div>
    </div>`;
  }
  h += `</div>`;
  return h;
}
// The Dorm panel: the tier the room is at, what is in each slot, the furniture shop, and the
// display cases. Everything shown is DERIVED from the save by dorm.js — this only formats it.
// `selDormSlot` is transient UI state (which slot the player is filling), deliberately not saved.
let selDormSlot = null;
function renderDormPanel(){
  if (!S.home.owned) return "";
  const tier = DORM.tierFor(S), prog = DORM.progressToNextTier(S);
  const slots = DORM.slotsFor(S);
  const furniture = S.home.furniture || {};
  const stock = DORM.unplaced(S);
  let h = `<div class="panel" style="margin-top:12px"><h3>🛏️ Your Dorm — ${tier.name}</h3>
    <p class="sub">${tier.w}×${tier.d}m · ${tier.slots} furnishing slots. Walk to the Student Dorms on campus to go inside.
    ${prog.maxed ? "This room is as grand as it gets." : `${prog.have}/${prog.need} upgrade levels toward <b>${prog.next.name}</b>.`}</p>
    ${prog.maxed ? "" : `<div class="pbar" style="margin-bottom:10px"><div style="width:${prog.pct}%"></div></div>`}`;

  // slots
  h += `<div class="row" style="flex-wrap:wrap;gap:6px">`;
  for (const s of slots){
    const item = DORM.FURNITURE_MAP[furniture[s.id]];
    const sel = selDormSlot === s.id;
    h += `<button class="btn sm ${sel?"gold":""}" onclick="window.__ev('dormSlot|${s.id}')"
      title="${s.kind} slot">${item ? `${item.icon} ${item.name}` : `➕ empty (${s.kind})`}</button>`;
  }
  h += `</div>`;

  if (selDormSlot){
    const slot = DORM.slotById(S, selDormSlot);
    const held = furniture[selDormSlot];
    h += `<div class="panel" style="margin-top:10px;background:rgba(0,0,0,.18)">
      <div style="font-weight:700">Slot “${selDormSlot}” · ${slot ? slot.kind : "?"}</div>`;
    if (held){
      h += `<div class="sub" style="margin:6px 0">Holding ${DORM.FURNITURE_MAP[held].icon} ${DORM.FURNITURE_MAP[held].name}.</div>
        <button class="btn sm" onclick="window.__ev('dormUnplace|${selDormSlot}')">Take it back</button>`;
      if (held === "case"){
        const shown = (S.home.cases || {})[selDormSlot];
        const card = shown && S.cards.find(c => c.uid === shown);
        h += `<div style="margin-top:10px"><b>Display case</b>
          <div class="sub">${card ? `Showing ${CARD_MAP[card.id].name} · ${gradeForRoll(card.roll).name} · #${card.serial}` : "Empty."}</div>`;
        const options = DORM.displayable(S, gradeForRoll);
        if (!options.length) h += `<div class="sub" style="margin-top:4px">You have no slabbed cards yet — grade a card to a 9 or 10 first.</div>`;
        else {
          h += `<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px">`;
          for (const o of options.slice(0, 12))
            h += `<button class="btn sm ${shown===o.uid?"ok":""}" onclick="window.__ev('dormDisplay|${selDormSlot}|${o.uid}')">${CARD_MAP[o.id].name} · ${o.grade.name} #${o.serial}</button>`;
          h += `</div>`;
          if (card) h += `<button class="btn sm" style="margin-top:6px" onclick="window.__ev('dormClearCase|${selDormSlot}')">Empty the case</button>`;
        }
        h += `</div>`;
      }
    } else if (!stock.length){
      h += `<div class="sub" style="margin:6px 0">Nothing in storage. Buy furniture below, then place it here.</div>`;
    } else {
      h += `<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px">`;
      for (const u of stock){
        const f = DORM.FURNITURE_MAP[u.id];
        const bad = DORM.placementProblem(S, selDormSlot, u.id);
        h += `<button class="btn sm ${bad?"":"ok"}" ${bad?"disabled":""} title="${bad||""}"
          onclick="window.__ev('dormPlace|${selDormSlot}|${u.id}')">${f.icon} ${f.name} ×${u.count}</button>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
  }

  // shop
  h += `<div style="margin-top:12px"><b>Furnishings</b> <span class="sub">bought with gold and timber</span></div>
    <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px">`;
  for (const f of DORM.FURNITURE){
    const owned = (S.home.stock || {})[f.id] || 0;
    const afford = S.gold >= f.gold && (S.inventory.oak_log || 0) >= f.timber;
    h += `<button class="btn sm ${afford?"gold":""}" ${afford?"":"disabled"} onclick="window.__ev('dormBuy|${f.id}')">
      ${f.icon} ${f.name} · 🪙${f.gold}${f.timber?` 🪵${f.timber}`:""}${owned?` (own ${owned})`:""}</button>`;
  }
  h += `</div>`;

  const trophies = DORM.trophiesFor(S);
  h += `<div style="margin-top:12px"><b>Trophies</b> <span class="sub">earned by beating bosses — they appear in the room on their own</span></div>
    <div class="sub">${trophies.length ? trophies.map(t=>`${t.icon} ${t.name}`).join(" · ") : "No boss trophies yet."}</div>`;
  h += `</div>`;
  return h;
}
window.__EV.dormSlot = (id)=>{ selDormSlot = (selDormSlot === id ? null : id); render(); };
window.__EV.dormBuy = (id)=>{ const r = DORM.buyFurniture(S, id); r.ok ? toast(`${r.item.icon} ${r.item.name} delivered to your dorm`) : err(r.err==="gold"?"Not enough gold":r.err==="timber"?"Need timber (chop wood)":""); save(); render(); };
window.__EV.dormPlace = (slot,item)=>{ const r = DORM.place(S, slot, item); r.ok ? toast("Placed.") : err(r.err); save(); render(); };
window.__EV.dormUnplace = (slot)=>{ DORM.unplace(S, slot); save(); render(); };
window.__EV.dormDisplay = (slot,uid)=>{ const r = DORM.displayIn(S, slot, uid); r.ok ? toast("🏆 On display.") : err(r.err); save(); render(); };
window.__EV.dormClearCase = (slot)=>{ DORM.clearCase(S, slot); save(); render(); };

        <div class="sub">${u.desc}</div>
        <div class="pbar" style="margin-bottom:8px"><div style="width:${n/u.max*100}%"></div></div>

    <div class="grow"><b>${dl.text}</b> · ${dl.progress}/${dl.target} <span class="sub">${dl.claimed?"claimed":"reward: gold + 2 cards"}</span></div>
    <button class="btn gold ${(dl.claimed||dl.progress<dl.target)?"":"ok"}" ${(dl.claimed||dl.progress<dl.target)?"disabled":""} onclick="window.__ev('claimDaily')">${dl.claimed?"Claimed":"Claim"}</button>
  </div></div>`;
  // your school
  h += `<div class="panel" style="margin-top:12px"><h3>🎓 Your School: ${SCHOOLS[S.school].name}</h3><div class="row" style="align-items:center">
    <div class="grow sub">${SCHOOL_DESC[S.school]} Your school's creatures gain +1 attack, and your spells deal bonus damage against their counter-school.</div>
    <button class="btn" onclick="window.__ev('openSchoolPicker')">Change School</button>
  </div></div>`;
  h += `<div class="panel" style="margin-top:14px"><h3>${STR.skills_title}</h3><div class="row">`;

  h += `</div></div>`;
  // Save backup/import/export (BACKLOG §9). The one place player progress lives is this browser's
  // localStorage — no account, no server copy — so it is also the one thing this game cannot
  // regenerate if it is ever lost. A backup is honest specifically because it is nothing but the
  // exact bytes save() already writes.
  h += `<div class="panel" style="margin-top:14px"><h3>💾 Save Data</h3>
    <p class="sub">Your save lives only in this browser. Download a backup, or restore one on another device.</p>

    </div></div>`;
  el.innerHTML = h;
}
window.__EV.exportSave = ()=>{
  const blob = new Blob([G.exportSave(S)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `arcane-legends-save-${(S.name||"wizard").replace(/[^a-z0-9]+/gi,"_")}-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("Backup downloaded.");
};
window.__EV.importPick = ()=>{
  const input = $("importFile"); const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const r = G.importSave(reader.result);
    input.value = "";   // so picking the SAME file again still fires a change event
    if (!r.ok){
      err(r.err==="json" ? "That file isn't valid JSON." : r.err==="version" || r.err==="shape" ? "That doesn't look like an Arcane Legends save." : "Couldn't read that save.");
      return;
    }
    pendingImport = r.save;
    showOverlay("⬆️ Import Backup", `<p class="sub">This REPLACES your current save. It cannot be undone unless you also have a backup of what's here now.</p>
      <div class="panel"><div style="font-weight:700">${esc(r.save.name || CC.DEFAULT_NAME)}</div>
        <div class="sub">${SCHOOLS[r.save.school]?.name||r.save.school} · Level ${r.save.level} · ${r.save.gold}g · ${r.save.cards.length} cards</div></div>
      <div class="row" style="margin-top:10px">
        <button class="btn danger" onclick="window.__ev('importConfirm')">Replace my save</button>
        <button class="btn" onclick="window.__ev('ovClose')">Cancel</button>
      </div>`);
  };
  reader.readAsText(file);
};
let pendingImport = null;
window.__EV.importConfirm = ()=>{
  if (!pendingImport) return;
  S = pendingImport; pendingImport = null;
  applyAccent();   // an imported save can carry a different school than the one just replaced
  save();
  document.getElementById("overlay").style.display = "none";
  toast("Save imported.");
  refreshGear(); render();
};

window.__EV.upgrade = (id)=>{ const r=G.upgradeHome(S,id); r.ok?toast("Upgraded!"):err(r.err==="gold"?"Not enough gold":r.err==="timber"?"Need timber (chop wood)":"Max"); render(); };

// ================= SKILLS =================
function renderSkills(el){
  let h = `<h2>${STR.skills_title}</h2><p class="sub">Mine, fish, and chop to gather. Smith and brew to craft gear and potions.</p>`;
  // skill levels
  h += `<div class="skillgrid" style="margin-bottom:12px">`;
  for (const [skill,info] of Object.entries(SKILLS)){
    const lv = S.skills[skill]; const xp = S.skillXp[skill]; const need = G.xpForLevel(lv);
    h += `<div class="kpi"><div class="lv">${info.icon} ${lv}</div><div class="nm">${info.name}</div>
      <div class="pbar" style="margin-top:6px"><div style="width:${Math.min(100,xp/need*100)}%"></div></div>
      <div style="font-size:10px;color:var(--muted)">${Math.floor(xp)}/${need} xp</div></div>`;
  }
  h += `</div>`;
  // gathering
  h += `<h3>⛏️ Gather</h3><div class="row">`;
  for (const m of MATERIALS){
    const can = G.canGather(S,m);
    h += `<div class="panel" style="flex:1;min-width:150px">
      <div style="font-weight:700"><span class="ic">${m.icon}</span> ${m.name}</div>
      <div class="sub">${SKILLS[m.skill].name} ${m.lvl} · +${m.xp} xp</div>
      <button class="btn sm ${can&&gatherCooldown<=0?"ok":""}" ${can?"":"disabled"} onclick="window.__ev('gather|${m.id}')">${can?"Gather":"Lv too low"}</button>
    </div>`;
  }
  h += `</div>`;
  // smithing
  h += `<h3>⚒️ Smith (smelt bars)</h3><div class="row">`;
  for (const b of BARS){
    const req = Object.entries(b.req).map(([id,n])=>`${fname(id)}×${n}`).join(" + ");
    const ok = G.canCraft(S,b);
    h += `<div class="panel" style="flex:1;min-width:150px">
      <div style="font-weight:700"><span class="ic">${b.icon}</span> ${b.name}</div>
      <div class="sub">Smelting ${b.lvl} · +${b.xp} xp</div>
      <div class="sub">${req}</div>
      <button class="btn sm ${ok?"ok":""}" ${ok?"":"disabled"} onclick="window.__ev('smelt|${b.id}')">Smelt</button></div>`;
  }
  h += `</div>`;
  // forging
  h += `<h3>⚒️ Forge equipment</h3><div class="row">`;
  for (const metal of Object.keys(METALS)){
    for (const slot of SLOTS){
      const e = equipmentFor(metal, slot.id);
      const ok = G.skillLevel(S,"smithing") >= e.lvl && (S.inventory[e.barId]||0) >= e.bars;
      h += `<div class="panel" style="flex:1;min-width:150px">
        <div style="font-weight:700">${e.icon} ${e.name}</div>
        <div class="sub">Smelting ${e.lvl} · ${e.bars}× ${e.name.split(" ")[0]} bar</div>
        <div class="sub" style="color:var(--gold)">${equipStatsLabel(e)}</div>
        <button class="btn sm ${ok?"ok":""}" ${ok?"":"disabled"} onclick="window.__ev('forge|${e.id}')">Forge</button></div>`;
    }
  }
  h += `</div>`;
  // alchemy
  h += `<h3>⚗️ Brew potions</h3><div class="row">`;
  for (const p of POTIONS){
    const ok = G.skillLevel(S,"alchemy") >= p.lvl && G.hasItems(S,p.req);
    const req = Object.entries(p.req).map(([id,n])=>`${fname(id)}×${n}`).join(" + ");
    h += `<div class="panel" style="flex:1;min-width:150px">
      <div style="font-weight:700">${p.icon} ${p.name}</div>
      <div class="sub">Alchemy ${p.lvl} · heals ${p.heal} in duels</div>
      <div class="sub">${req}</div>
      <button class="btn sm ${ok?"ok":""}" ${ok?"":"disabled"} onclick="window.__ev('brew|${p.id}')">Brew</button></div>`;
  }
  h += `</div>`;
  // scribing
  h += `<h3>🪶 Scribe cards (the Arcanum loop)</h3><p class="sub">Refine wood, fish, and ore into card materials, then scribe a spell card. Higher Scribing skill yields better grades.</p>`;
  h += `<div class="row">`;
  for (const cm of CARD_MATERIALS){
    const sources = cm.from.map(fid=>{ const s=MATERIALS.find(m=>m.id===fid); return s?`${s.icon} ${s.name} (${s.lvl})`:"⚪"; }).join(" · ");
    const have = S.inventory[cm.id]||0;
    h += `<div class="panel" style="flex:1;min-width:170px">
      <div style="font-weight:700">${cm.icon} ${cm.name} <span style="color:var(--gold)">×${have}</span></div>
      <div class="sub">Refine from: ${sources}</div>
      <div class="row" style="gap:4px">`;
    for (const fid of cm.from){
      const mat = MATERIALS.find(m=>m.id===fid);
      if (!mat) continue;
      const can = (S.inventory[fid]||0) > 0;
      h += `<button class="btn sm ${can?"ok":""}" ${can?"":"disabled"} onclick="window.__ev('refine|${cm.id}|${fid}')">${mat.icon}</button>`;
    }
    h += `</div></div>`;
  }
  h += `</div>`;
  const canScribe = (S.inventory.canvas||0)>0 && (S.inventory.ink||0)>0 && (S.inventory.reagent||0)>0;
  h += `<div class="panel"><div style="font-weight:700">🪶 Scribe a Spell Card</div>
    <div class="sub">Spend 1 🖼️ Canvas + 1 🖋️ Ink + 1 🧪 Reagent to create a random card (grade 1-10). Grades 9-10 become slabs with a serial number.</div>
    <button class="btn gold ${canScribe?"":"disabled"}" ${canScribe?"":"disabled"} onclick="window.__ev('scribe')">Scribe · 🖼️${S.inventory.canvas||0} 🖋️${S.inventory.ink||0} 🧪${S.inventory.reagent||0}</button></div>`;
  el.innerHTML = h;
}

function renderCollection(el){
  const gear = G.equipStats(S);
  let h = `<h2>${STR.collection_title}</h2><p class="sub">${S.cards.length} cards · value ${G.totalCollectionValue(S)}g · pack ${G.PACK_COST}g</p>`;
  h += `<div class="row" style="margin-bottom:10px">

    <button class="btn" onclick="window.__ev('openCodex')">📖 Codex</button></div>`;
  // Printings tally, so a collection is something to look at and not just a pile. Derived from
  // the cards every render — nothing about it is stored.
  const tally = VAR.tallyFor(S.cards);
  const tallyRow = VAR.VARIANTS.filter(v => v.id !== "normal" && tally[v.id])
    .map(v => `<div class="kpi"><div class="lv" style="font-size:16px">${v.badge} ${tally[v.id]}</div><div class="nm">${v.name}</div></div>`).join("");
  if (tallyRow || tally.firstEditions){
    h += `<div class="row" style="margin-bottom:8px">${tallyRow}` +
      (tally.firstEditions ? `<div class="kpi"><div class="lv" style="font-size:16px">${VAR.FIRST_EDITION_BADGE} ${tally.firstEditions}</div><div class="nm">First Editions</div></div>` : "") +
      `</div>`;
  }
  h += `<div class="row">`;
  // Rare printings and first editions float to the top: the best thing you own should not be
  // ninety cards down a scroll.
  for (const c of [...S.cards].sort((a,b) => VAR.collectionRank(b) - VAR.collectionRank(a))){
    const def = CARD_MAP[c.id];
    const val = G.instanceValue(c);          // printing + first edition, not just the grade
    const g = c.graded ? gradeForRoll(c.roll) : null;
    h += `<div style="display:flex;flex-direction:column;align-items:center;gap:4px">${cardFace(def, { inst:c, grade:c.graded?c.roll:null, value:val, slab:g&&g.slab, serial:c.serial })}
      <div class="row" style="gap:4px">
        <button class="btn sm ok" ${c.graded?"disabled":""} onclick="window.__ev('grade|${c.uid}')">${c.graded?`<span style="font-size:10px">${g.icon} ${g.name}</span>`:"Grade"}</button>
        ${c.graded?`<button class="btn sm" onclick="window.__ev('regrade|${c.uid}')">Regrade</button>`:""}
        <button class="btn sm danger" onclick="window.__ev('sell|${c.uid}')">Sell</button>
      </div></div>`;
  }
  h += `</div>`;
  h += `<div class="panel" style="margin-top:12px"><h3>📖 Grading</h3><div class="row">`;
  for (const g of GRADES) h += `<div class="kpi" style="flex:1"><div style="font-size:22px">${g.icon}</div><div class="nm">${g.name} (${g.min}+) · ×${g.x}</div></div>`;
  h += `</div></div>`;
  el.innerHTML = h;
}

// ================= CODEX (codex.js) =================
// The collection screen shows what you OWN. The Codex shows the whole catalog, so the question a
// collection game exists to keep asking — *what am I missing?* — is answerable at all. Filters
// live here rather than on the collection grid for the same reason: you cannot filter a list of
// owned cards for the ones you do not own.
let codexView = { filter:"all", sort:"school", school:"", query:"" };
function buildCodex(){
  const comp = CX.overallCompletion(CARDS, S.cards);
  const bySchool = CX.completionBy(CARDS, S.cards, d => d.school);
  const ach = CX.achievementsFor(CARDS, S.cards);
  const achDone = ach.filter(a => a.done).length;

  let h = `<p class="sub">${comp.owned}/${comp.total} cards discovered · ${achDone}/${ach.length} achievements</p>
    <div class="pbar" style="margin-bottom:10px"><div style="width:${comp.pct}%"></div></div>`;

  // per-school completion
  h += `<div class="row" style="flex-wrap:wrap;margin-bottom:10px">`;
  for (const [id, g] of Object.entries(bySchool)){
    const sc = SCHOOLS[id];
    h += `<div class="kpi" style="min-width:96px"><div class="lv" style="font-size:15px;color:${sc.color}">${SCHOOL_ICON[id]} ${g.owned}/${g.total}</div>
      <div class="nm">${sc.name}</div><div class="pbar" style="margin-top:4px"><div style="width:${g.pct}%"></div></div></div>`;
  }
  h += `</div>`;

  // controls
  h += `<div class="row" style="flex-wrap:wrap;gap:5px;margin-bottom:6px">` +
    CX.FILTERS.map(f => `<button class="btn sm ${codexView.filter===f.id?"gold":""}" onclick="window.__ev('cxFilter|${f.id}')">${f.label}</button>`).join("") +
    `</div>`;
  h += `<div class="row" style="flex-wrap:wrap;gap:5px;margin-bottom:6px"><span class="sub" style="align-self:center">Sort</span>` +
    CX.SORTS.map(o => `<button class="btn sm ${codexView.sort===o.id?"gold":""}" onclick="window.__ev('cxSort|${o.id}')">${o.label}</button>`).join("") +
    `</div>`;
  h += `<div class="row" style="flex-wrap:wrap;gap:5px;margin-bottom:6px">
    <button class="btn sm ${codexView.school===""?"gold":""}" onclick="window.__ev('cxSchool|')">All schools</button>` +
    Object.keys(SCHOOLS).map(id => `<button class="btn sm ${codexView.school===id?"gold":""}" onclick="window.__ev('cxSchool|${id}')">${SCHOOL_ICON[id]}</button>`).join("") +
    `<input id="cxQ" type="text" placeholder="Search…" value="${escapeAttr(codexView.query)}" oninput="window.__ev('cxQuery')"
      style="flex:1;min-width:120px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:#12101c;color:var(--ink)"></div>`;

  const rows = CX.browse(CARDS, S, codexView);
  h += `<p class="sub">${rows.length} card${rows.length===1?"":"s"}</p><div class="row">`;
  for (const r of rows){
    // An unowned card is shown as a silhouette rather than hidden: a codex that hides what you
    // are missing cannot tell you what to chase.
    const face = cardFace(r.def, { inst: r.owned ? { variant:r.owned.bestVariant, fe:r.owned.fe } : null,
                                   grade: r.owned && r.owned.graded ? r.owned.bestRoll : null });
    h += `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;${r.owned?"":"opacity:.34;filter:grayscale(1)"}">
      ${face}
      <div class="row" style="gap:4px;align-items:center">
        <button class="btn sm ${r.favorite?"gold":""}" title="Favourite" onclick="window.__ev('cxFav|${r.def.id}')">${r.favorite?"★":"☆"}</button>
        <span class="sub" style="font-size:11px">${r.owned ? `×${r.owned.count}` : "not owned"}</span>
      </div></div>`;
  }
  h += `</div>`;

  // achievements
  h += `<div class="panel" style="margin-top:14px"><h3>🏅 Collection Achievements</h3><div class="row" style="flex-wrap:wrap">`;
  for (const a of ach){
    h += `<div class="kpi" style="min-width:150px;${a.done?"":"opacity:.6"}">
      <div class="lv" style="font-size:18px">${a.icon} ${a.done?"✔":""}</div>
      <div class="nm">${a.name}</div>
      <div style="font-size:10px;color:var(--muted)">${a.desc}</div>
      ${a.done?"":`<div class="pbar" style="margin-top:4px"><div style="width:${a.pct}%"></div></div>
      <div style="font-size:10px;color:var(--muted)">${a.have}/${a.need}</div>`}</div>`;
  }
  h += `</div></div>`;

  // card backs (cardbacks.js) — unlocked by the achievements just above, not a second grind
  const doneIds = ach.filter(a => a.done).map(a => a.id);
  const equipped = CB.equippedBack(S).id;
  h += `<div class="panel" style="margin-top:14px"><h3>🎴 Card Backs</h3><p class="sub">Unlocked by the achievements above. Pick one to show on face-down cards.</p><div class="row" style="flex-wrap:wrap">`;
  for (const b of CB.CARD_BACKS){
    const unlocked = CB.isUnlocked(b.id, doneIds);
    h += `<div class="packcard" style="${unlocked?"cursor:pointer":"cursor:not-allowed;opacity:.35"}" ${unlocked?`onclick="window.__ev('backEquip|${b.id}')"`:""} title="${unlocked?b.name:b.name+" (locked)"}">
      <div class="flip" style="transform:none">
        <div class="face front" style="position:static;transform:none;background:${b.css};display:flex;align-items:center;justify-content:center;height:100%;border-radius:10px;
          ${b.id===equipped?"outline:3px solid var(--gold)":"border:2px solid var(--line)"}">
          <span style="color:${b.emblemColor};font-size:26px">${unlocked?b.emblem:"🔒"}</span>
        </div>
      </div>
    </div>`;
  }
  h += `</div></div>`;

  // account-wide achievements + player titles (achievements.js) — everything BESIDES the
  // collection: field quests, dungeon bosses, PvP rank, wealth, crafting, reputation.
  const achv = ACHV.achievementsFor(S);
  const achvDoneIds = achv.filter(a => a.done).map(a => a.id);
  const equippedTitle = ACHV.equippedTitle(S).id;
  h += `<div class="panel" style="margin-top:14px"><h3>🏆 Achievements</h3><div class="row" style="flex-wrap:wrap">`;
  for (const a of achv){
    h += `<div class="kpi" style="min-width:150px;${a.done?"":"opacity:.6"}">
      <div class="lv" style="font-size:18px">${a.icon} ${a.done?"✔":""}</div>

  if (d.variant && d.variant !== "normal") return "slab";

  for (const a of S.auctions){
    const c = CARD_MAP[a.card.id];
    // BUG (found while adding price history nearby): `a.ends` is a Date.now() wall-clock
    // timestamp (fixed to be exactly that so a listing survives a reload — see listAuction's own

    const left = Math.max(0, Math.ceil((a.ends - Date.now())/1000));

  h += `<div class="sub">List an ungraded card below to auction it to NPC collectors.</div></div>`;
  // list auction
  h += `<div class="panel"><h3>List a card for auction</h3><div class="row">`;

  h += `<div class="panel"><h3>📈 Price History</h3>`;
  if (!S.marketHistory.length){
    h += `<div class="sub">Nothing has sold yet — list a card above and let it run its 60s.</div>`;

    const byCard = {};
    for (const rec of S.marketHistory){ (byCard[rec.cardId] = byCard[rec.cardId] || []).push(rec); }
    const cardIds = Object.keys(byCard).sort((a,b) => byCard[b].length - byCard[a].length).slice(0, 12);
    h += `<div class="row" style="flex-wrap:wrap">`;
    for (const id of cardIds){
      const c = CARD_MAP[id]; if (!c) continue;

        <div class="sub">Recent: ${recent.map(r=>`${r.pay}g`).join(", ")}</div>

    }

  }
  h += `</div>`;
  el.innerHTML = h;

  h += `<div class="panel"><h3>🧪 Deck Testing Laboratory</h3>

const LAB_ICON = { midrange:"⚔️", aggro:"🔥", control:"🛡️", tempo:"⚡", boss:"👑" };
function randomAiDeck(){
  // build a 30-card deck from random cards
  const pool = [];
  for (const c of CARDS){ for (let i=0;i<3;i++) pool.push(c.id); }
  const deck = [];
  while (deck.length < 30) deck.push(pool[Math.floor(Math.random()*pool.length)]);
  return deck;
}
window.__EV.localPvp = ()=>{

  const gear = { hp: gearTier*5, atk: gearTier, def: Math.floor(gearTier/2), pip: gearTier>=4?1:0 };
  // A random personality (never "boss" — that escalation is reserved for real bosses) so the
  // quick-match AI is not the same opponent in a different deck every time.
  const casual = ARCH.ARCHETYPE_IDS.filter(id => id !== "boss");
  const archetype = casual[Math.floor(Math.random()*casual.length)];
  startLocalDuel(randomAiDeck(), gear, "AI Wizard", -1, false, { archetype });

window.__EV.online = ()=>{ setupOnline(); };
window.__EV.labDuel = (archetype)=>{

  // so the result reflects the DECK, not a random gear roll, and a school picked round-robin from
  // the schools that AREN'T the player's own — the interesting matchup is against someone else's
  // magic, not a mirror of your own affinity bonus.
  const schools = Object.keys(SCHOOLS).filter(s => s !== S.school);
  const school = schools[Math.floor(Math.random()*schools.length)] || "balance";
  const pool = CARDS.filter(c => c.school === school);

// Sync the 3D duel arena to the battle board (summon/remove creatures as played).
function syncBattle3d(){
  try {
    if (!battle) return;
    const cv = $("battle3d");
    if (!cv) return;
    if (!battle3d) window.__battle3d = battle3d = createBattle3d(cv);
    const r = cv.parentElement.getBoundingClientRect();
    battle3d.setSize(r.width, r.height);
    battle3d.sync(battle.you.board, battle.enemy.board);

}
function startPracticeDuel(){

function startLocalDuel(enemyDeck, enemyGear, enemyName, questIdx, isQuest, opts = {}){

  // dungeon and open-world enemies are not quests, but they still have their own declared HP

  const enemyHp = opts.hp != null ? opts.hp : (isQuest ? G.QUESTS[questIdx].hp : 100);

  battle = G.startDuel(S.deck, G.equipStats(S), enemyDeck, enemyGear, enemyHp, S.school, enemySchool);

// Spell VFX. The card has to be captured BEFORE playCard, because playing it removes it from

}

window.__EV.duelAgain = ()=>{

    G.dailyProgress(S, "win");
    if (dungeonFoe){
      // WORLDSPEC §6: dungeon progress persists, so a cleared dungeon stays cleared.

      }
    }
    if (isQuest && !G.questDone(S, qIdx)){

    } else {
      const base = isQuest ? 30 : 40 + Math.floor(Math.random()*40);

    }

    loseSfx();

  }

function sendOnline(obj){ if (online && online.ws && online.ws.readyState===1) online.ws.send(JSON.stringify(obj)); }
function connectOnline(){
  const base = location.pathname.replace(/\/+$/,"");

  online.ws.onclose = ()=>{ setTimeout(connectOnline, 1500); };
  online.ws.onmessage = (e)=>{

let world = null, worldPrompt = null;
function stationTarget(station){

}
// Quest-giving NPCs out in the world. Their dialogue is BUILT from zonequests.js rather than
// written per NPC, so adding a quest to the data adds it to the right NPC's conversation with no
// UI change — and an NPC can never end up offering a quest that no longer exists.
const QUEST_GIVERS = {
  forest_sage:   { name: "Sage Rowan",  role: "Keeper of the Whispering Wood",
                   idle: ["The wood remembers every spell cast under it.", "Walk softly and it will show you what grows here."] },
  forest_warden: { name: "Warden Brisk", role: "Warden of Cinderhollow",
                   idle: ["I watch the cavern mouth so the village does not have to.", "Whatever is down there, it is getting bolder."] },
  lake_hermit:   { name: "Hermit Calder", role: "Keeper of the Shore",
                   idle: ["The lake was a valley once. Ask it nicely and it still remembers.", "Fish the shallows before you fish the shelf."] },
  lake_diver:    { name: "Diver Nell",   role: "Vault Diver",
                   idle: ["I have been down twice. I am not going a third time alone.", "Whatever the water took, it did not drown."] },
};
function questDialogue(giver){
  const g = QUEST_GIVERS[giver];
  if (!g) return null;
  const offers = ZQ.offeredBy(S, giver);
  const turnIns = ZQ.turnInsFor(S, giver);
  const active = ZQ.activeQuests(S).filter(q => q.giver === giver);
  const rep = REP.repOf(S, giver), repLvl = REP.levelFor(rep);
  const lines = [];
  // Reputation is shown at the TOP of the conversation, not buried, since it is the one thing
  // this NPC's dialogue says about the player rather than about a quest.
  lines.push(`<span style="color:var(--muted);font-size:12px">Standing: <b style="color:var(--gold)">${repLvl.name}</b>${repLvl.bonus ? ` (+${repLvl.bonus}% from ${g.name})` : ""}</span>`);
  for (const q of turnIns) lines.push(`<b style="color:var(--gold)">${q.title}</b> — done. Well fought.`);
  for (const q of active.filter(q => !turnIns.includes(q))){
    const p = ZQ.progressOf(S, q);
    lines.push(`<b>${q.title}</b> — ${ZQ.objectiveText(q, matName(q))} <span style="color:var(--muted)">(${p.have}/${p.need})</span>`);
  }
  for (const q of offers) lines.push(`<b style="color:var(--gold)">${q.title}</b><br>${q.brief}`);
  if (!turnIns.length && !active.length && !offers.length) lines.push(...g.idle);
  const buttons = [];
  for (const q of turnIns) buttons.push({ label: `✅ Hand in: ${q.title}`, primary: true, action: ()=>turnInQuest(q.id) });
  for (const q of offers) buttons.push({ label: `📜 Accept: ${q.title}`, primary: !turnIns.length, action: ()=>acceptQuest(q.id) });
  buttons.push({ label: "Leave", action: ()=>closeDialogue() });
  return { name: g.name, role: g.role, lines, buttons };
}
const matName = q => q.objective.kind === "gather"
  ? ((MATERIALS.find(m => m.id === q.objective.id) || {}).name || q.objective.id) : null;
function acceptQuest(id){
  const r = ZQ.accept(S, id);

  toast(`📜 Quest accepted: ${r.quest.title}`);
  AUDIO.play("ui");
}
function turnInQuest(id){
  const r = ZQ.turnIn(S, id);
  if (!r.ok){ err(r.err === "incomplete" ? "Not finished yet." : "That quest is not active."); return; }
  // Two independent bonuses stack on the gold reward: the player's academy year (a global
  // curriculum perk) and standing with THIS giver (a per-NPC relationship). zonequests.js
  // deliberately does not know about either — it hands back the base reward and the two systems
  // that DO know about progression apply their cut here.
  const pct = G.academyPerks(S).questGold + REP.bonusFor(S, r.quest.giver);
  const gold = Math.round((r.reward.gold || 0) * (1 + pct / 100));
  G.gainGold(S, gold);
  if (r.reward.xp) G.addWizardXp(S, r.reward.xp);

  REP.gainRep(S, r.quest.giver, REP.REP_PER_QUEST);
  save(); closeDialogue();
  toast(`✅ ${r.quest.title} complete! +${gold}g${r.reward.cards ? ` +${r.reward.cards} cards` : ""}`);

  render();
}

function spawnWorld(canvas, zone, spawnAt){

// WORLDSPEC step 4. Tears the current zone's scene down and builds the target zone, dropping the
// player at the reciprocal exit so the two zones join up. Guarded by `zoning` because the world
// keeps running (and can fire the trigger again) during the rebuild.
let zoning = false;
// WORLDSPEC step 5. Dungeons are compiled into ZONES (see dungeons.js) and registered alongside
// the outdoor ones, so entering and leaving one is the step-4 transition path — no separate
// suspend/restore machinery, and the save already records which zone the player is in.
function enterDungeon(id){
  if (!worldCfg || !worldCfg.get(id)){ console.warn("unknown dungeon", id); return; }

  S.worldState.dungeons[id] = S.worldState.dungeons[id] || { cleared: [], defeated: [], bossDead: false };
  changeZone(id, activeZone && activeZone.id);
}
// Bumping into a dungeon enemy starts a duel. Level picks the GEAR tier off the quest ladder
// (so a Lv3 slime is not geared like the Archon's endgame) — but the DECK and the battle
// personality are the monster's own, built from archetypes.js rather than borrowed from a human
// rival's authored list. A Cinder Slime playing "The Academy Rookie"'s exact fire deck was the
// "one strategy, different decks" problem this system exists to fix.
function startDungeonFight(id){
  const zone = activeZone;
  const foe = (zone && zone.enemies || []).find(e => e.id === id);
  if (!foe) return;
  const tier = Math.max(0, Math.min(G.QUESTS.length - 1, Math.floor((foe.level || 1) / 2)));
  const q = G.QUESTS[tier];
  const archetype = ARCH.archetypeFor(foe);
  const school = ARCH.flavorSchoolFor(foe);
  const pool = CARDS.filter(c => c.school === school);
  const deck = ARCH.archetypeDeckFor(archetype, pool);
  // The boss's own declared HP (dungeons.json `boss.hp`) — previously ignored entirely, so the
  // Cinder Wyrm and the Drowned Archon were fighting at the open-world default of 100, not the
  // 200/280 their own data declares. That undersells a boss fight and, now that boss phases exist,
  // also mistimes them (the phase thresholds are HP FRACTIONS of the intended total).
  startLocalDuel(deck, q.gear, foe.name, tier, false, { archetype, school, hp: foe.hp });
  // Remembered on the battle so the reward/persistence step knows what was actually beaten.
  battle.dungeonFoe = { zone: zone.id, id: foe.id, room: foe.room, boss: !!foe.boss };
}
// Record a dungeon kill: remove it from the world, persist it, and mark the room cleared once
// nothing in it is left standing.
function recordDungeonKill(foe){
  const st = (S.worldState.dungeons[foe.zone] = S.worldState.dungeons[foe.zone] ||
              { cleared: [], defeated: [], bossDead: false });
  if (st.defeated.includes(foe.id)) return;
  st.defeated.push(foe.id);
  if (world && world.removeEnemy) world.removeEnemy(foe.id);
  const zone = worldCfg && worldCfg.get(foe.zone);
  if (zone){
    const left = zone.enemies.filter(e => e.room === foe.room && !st.defeated.includes(e.id));
    if (!left.length && !st.cleared.includes(foe.room)){
      st.cleared.push(foe.room);
      toast("✨ Room cleared: " + foe.room);
    }
  }
}
// The Dorm phases, D1. The dorm is COMPILED FRESH on every entry rather than registered once at
// boot, because its geometry depends on the save: buying a hall upgrade grows the room and adds
// furniture slots (D4), and furniture placed since the last visit has to be in it. Recompiling is
// cheap (it is pure maths over one room) and it removes an entire class of staleness bug.
function enterDorm(){
  if (!worldCfg) return;

      ["The warden looks you over. \"No room assigned to you yet, student.\"",

// Fast travel (BACKLOG §3). Reuses changeZone exactly as a zone gateway would — no separate

// reciprocal exit and falls back to the zone's own default spawn point (worldconfig.js). Limited
// to zones this save has actually WALKED to at least once (`S.worldState.visited`, already tracked
// by changeZone below) and to outdoor zones (`!z.interior`) — dungeons and the dorm are entered
// through their own doorway/entrance on purpose, the same way a real place should be reached.
window.__EV.openFastTravel = ()=>{
  if (!worldCfg) return;
  const visited = new Set(S.worldState.visited || []);
  const zones = worldCfg.zoneIds.map(id => worldCfg.get(id)).filter(z => z && !z.interior && visited.has(z.id));
  let h = `<p class="sub">Instantly travel to any outdoor zone you've already discovered on foot.</p><div class="row" style="flex-wrap:wrap;gap:8px">`;
  for (const z of zones){

window.__EV.fastTravel = (zoneId)=>{

function changeZone(toZoneId, fromZoneId, spawnOverride){
  if (zoning || !worldCfg) return;
  const target = worldCfg.get(toZoneId);
  if (!target){ console.warn("exit to unknown zone", toZoneId); return; }
  zoning = true;
  const canvas = $("world");
  const spawnAt = spawnOverride || entryPointFor(worldCfg, toZoneId, fromZoneId);
  try {
    // Dispose FIRST: two live worlds would each hold a WebGL context on the same canvas and
    // both would keep running their rAF loops.
    if (world) world.dispose();
    // Clear the interaction prompt by hand. It is DOM that outlives the scene, so without this
    // the new zone opens showing the OLD zone's prompt — arriving in the forest still offered
    // "To Whispering Forest" from the academy gateway we just walked through.
    worldPrompt = null;
    $("prompt").style.display = "none";
    activeZone = target;
    world = spawnWorld(canvas, target, spawnAt);
    window.__world = world;
    world.setPlayerAppearance(CC.appearanceFor(S));
    world.setPlayerGear(EQ3.attachmentsFor(S));

}

async function initWorld(){
  const canvas = $("world");
